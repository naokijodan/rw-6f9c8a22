<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>新商品ウォッチ</title>
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#1B2330; --muted:#5A6474;
  --line:#E2E6EB; --accent:#D7263D; --indigo:#2B4C8C; --amber:#B26E0A;
  --green:#2E7D5B; --purple:#7B4FA6; --tint:#EDF0F4;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12161E; --surface:#1A202B; --ink:#E8EBF0; --muted:#98A2B3;
    --line:#2A3140; --accent:#F0455C; --indigo:#8CA9E0; --amber:#E0A44B;
    --green:#5CB48E; --purple:#B08BD8; --tint:#232A37;
  }
}
:root[data-theme="dark"]{
  --bg:#12161E; --surface:#1A202B; --ink:#E8EBF0; --muted:#98A2B3;
  --line:#2A3140; --accent:#F0455C; --indigo:#8CA9E0; --amber:#E0A44B;
  --green:#5CB48E; --purple:#B08BD8; --tint:#232A37;
}
:root[data-theme="light"]{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#1B2330; --muted:#5A6474;
  --line:#E2E6EB; --accent:#D7263D; --indigo:#2B4C8C; --amber:#B26E0A;
  --green:#2E7D5B; --purple:#7B4FA6; --tint:#EDF0F4;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
a{color:inherit; text-decoration:none}
a:hover .hl, .headline a:hover, .hl a:hover{text-decoration:underline}
img{max-width:100%}
.num{font-variant-numeric:tabular-nums}

/* ── マストヘッド ── */
.mast{background:var(--surface); border-bottom:1px solid var(--line)}
.mast-in{max-width:1080px; margin:0 auto; padding:14px 16px;
  display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 16px}
.brand{font-size:22px; font-weight:800; letter-spacing:.02em}
.brand b{color:var(--accent)}
.today{color:var(--muted); font-size:12.5px}
.switch{display:flex; gap:0; margin-left:auto; border:1px solid var(--line);
  border-radius:6px; overflow:hidden}
.switch button{appearance:none; border:0; background:var(--surface); color:var(--muted);
  padding:7px 14px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit}
.switch button+button{border-left:1px solid var(--line)}
.switch button.on{background:var(--ink); color:var(--bg)}
.switch button:focus-visible{outline:2px solid var(--indigo); outline-offset:-2px}
.theme-toggle{appearance:none; border:1px solid var(--line); border-radius:6px;
  background:var(--surface); color:var(--muted); padding:7px 10px; font-size:13px;
  font-weight:600; cursor:pointer; font-family:inherit}
.theme-toggle:focus-visible{outline:2px solid var(--indigo); outline-offset:-2px}
.wrap{max-width:1080px; margin:0 auto; padding:20px 16px 60px}

/* ── シリーズ切り替えナビ（全体｜ポケモン｜…） ── */
.pagenav{max-width:1080px; margin:0 auto; padding:0 16px 10px; display:flex;
  flex-wrap:wrap; gap:2px; font-size:12.5px; color:var(--muted)}
.pagenav a{color:var(--muted)}
.pagenav a.on{color:var(--accent); font-weight:800}
.pagenav a:hover{text-decoration:underline}
.pagenav .sep{margin:0 5px; color:var(--line)}

/* ── カテゴリ絞り込みタブ（全ページ・全レイアウト共通） ── */
.cattabs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px}

/* ── フィルターバー（期間・キャラクター・キーワード検索・絞り込みサマリー。
   全ページ・全レイアウト共通。cattabsの下、案A/B/Cの上に1つだけ表示する） ── */
.filterbar{background:var(--surface); border:1px solid var(--line); border-radius:8px;
  padding:12px 14px; margin-bottom:16px; display:flex; flex-direction:column; gap:10px}
.fb-row{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.fb-label{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); font-weight:600}
.fb-dates input[type=date]{appearance:none; font-family:inherit; font-size:13px; padding:5px 8px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface); color:var(--ink)}
.fb-tilde{color:var(--muted)}
.fb-shortcuts{display:flex; flex-wrap:wrap; gap:6px; margin-left:auto}
.fb-shortcuts button{appearance:none; font-family:inherit; cursor:pointer; font-size:12px;
  font-weight:600; padding:5px 10px; border-radius:999px; border:1px solid var(--line);
  background:var(--tint); color:var(--ink)}
.fb-shortcuts button:hover{background:var(--line)}
.fb-series{display:flex; flex-wrap:wrap; gap:6px; overflow-x:auto; padding-bottom:2px}
.fb-chip{appearance:none; font-family:inherit; cursor:pointer; font-size:12px; font-weight:600;
  padding:5px 11px; border-radius:999px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink); white-space:nowrap}
.fb-chip.on{background:var(--amber); border-color:var(--amber); color:#fff}
.fb-search input[type=text]{width:100%; font-family:inherit; font-size:13px; padding:7px 10px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface); color:var(--ink)}
.fb-summary{font-size:12.5px; color:var(--muted); display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.fb-summary .fb-count{font-weight:800; color:var(--ink)}
.fb-conds{color:var(--muted)}
.fb-reset{appearance:none; font-family:inherit; cursor:pointer; font-size:12px; font-weight:700;
  padding:4px 12px; border-radius:999px; border:1px solid var(--accent); background:var(--surface);
  color:var(--accent)}
.fb-reset:hover{background:var(--accent); color:#fff}
.fb-shortcuts button:focus-visible, .fb-chip:focus-visible, .fb-reset:focus-visible{
  outline:2px solid var(--indigo); outline-offset:2px}
@media(max-width:560px){
  .fb-dates{width:100%}
  .fb-shortcuts{margin-left:0; width:100%}
}

/* ── 日付ジャンプ目次（案B・案C。折りたたみ式・横スクロールのチップ列） ── */
.datejump{margin-bottom:14px; border:1px solid var(--line); border-radius:8px; background:var(--surface)}
.datejump summary{cursor:pointer; padding:8px 12px; font-size:12.5px; font-weight:700; color:var(--ink);
  list-style:none; display:flex; align-items:center; gap:4px}
.datejump summary::-webkit-details-marker{display:none}
.datejump summary::before{content:"▸"; color:var(--muted); font-size:11px; transition:transform .12s ease}
.datejump[open] summary::before{transform:rotate(90deg)}
.datejump-list{display:flex; gap:6px; overflow-x:auto; padding:0 12px 10px; scrollbar-width:thin}
.datejump-btn{appearance:none; font-family:inherit; cursor:pointer; font-size:11.5px; font-weight:600;
  padding:5px 10px; border-radius:6px; border:1px solid var(--line); background:var(--tint);
  color:var(--ink); white-space:nowrap; flex:0 0 auto}
.datejump-btn:hover{background:var(--line)}
.datejump-btn:focus-visible{outline:2px solid var(--indigo); outline-offset:2px}

/* ── バッジ ── */
.chip{display:inline-block; padding:1px 7px; border-radius:3px; font-size:11px;
  font-weight:700; line-height:1.7; white-space:nowrap}
.chip.soon{background:var(--accent); color:#fff}
.chip.today-chip{background:var(--accent); color:#fff}
.chip.rel{color:var(--green); border:1px solid currentColor}
.chip.pre{color:var(--indigo); border:1px solid currentColor}
.chip.lot{color:var(--purple); border:1px solid currentColor}
.chip.new{color:var(--indigo); border:1px solid currentColor}
.chip.cat{color:var(--muted); border:1px solid var(--line); font-weight:600}
.chip.series{color:var(--amber); border:1px solid currentColor; font-weight:600}
.chip.plat{color:var(--indigo); border:1px solid currentColor; font-weight:600}
.chip.sport{color:var(--indigo); border:1px solid currentColor; font-weight:600}
.chip.date-chip{color:var(--muted); border:1px solid var(--line); font-weight:600}
.chip.resale{color:var(--accent); border:1px solid currentColor; font-weight:600}

/* ── 外部サイト検索リンク（メルカリ｜Amazon｜楽天） ── */
/* white-space:normal（折り返し可）。nowrapだと小さいカード幅では横にはみ出すため */
.srch{display:block; margin-top:6px; font-size:11px; color:var(--muted); white-space:normal}
.srch a{color:var(--indigo); font-weight:700}
.srch a:hover{text-decoration:underline}
.srch .sep{margin:0 4px; color:var(--line)}

/* ── 商品ごとの抽選・予約受付ページ（src/lottery_research.py がリサーチ・照合）＋
   🔍 Google検索（全商品共通）。verified=falseのリンクは実機で別商品ページに
   飛ぶ誤りが確認されたため表示しない（stateには残すが表示側でのみ除外） ── */
.lotlinks{display:block; margin-top:4px; font-size:11px; color:var(--muted); white-space:normal}
.lotlinks .lbl{font-weight:800; color:var(--ink); margin-right:4px}
.lotlinks a{color:var(--accent); font-weight:700}
.lotlinks a:hover{text-decoration:underline}
.lotlinks a.glink{color:var(--muted); font-weight:600}
.lotlinks .sep{margin:0 4px; color:var(--line)}

/* ── 手動登録の予約リンク（config/manual_links.json。毎朝の自動収集(state更新)
   では上書きされないconfig側の手動データ。一致した商品にのみ表示） ── */
.manuallinks{display:block; margin-top:4px; font-size:11px; color:var(--muted); white-space:normal}
.manuallinks .lbl{font-weight:800; color:var(--ink); margin-right:4px}
.manuallinks a{color:var(--purple); font-weight:700}
.manuallinks a:hover{text-decoration:underline}
.manuallinks .mnote{color:var(--muted); font-weight:400; margin-left:2px}
.manuallinks .sep{margin:0 4px; color:var(--line)}

/* ── 画像 ── */
.ph{display:flex; align-items:center; justify-content:center; background:var(--tint);
  color:var(--muted); font-weight:700; text-align:center; padding:8px; font-size:12px}
.thumb{background:var(--tint); display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative}
.thumb img{width:100%; height:100%; object-fit:contain}
/* サムネイル画像を商品ページへのリンクにするラッパー。display:contents で
   自身は箱を生成せず、中身のthumbがそのままgrid/flexの直接の子として扱われる
   （hero/card/fcard/flist 各所の既存レイアウト計算に影響を与えないための工夫） */
.tlink{display:contents}

/* ════ 案A ポータル ════ */
.pA .layout{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:20px}
@media(max-width:820px){.pA .layout{grid-template-columns:1fr}}
.box{background:var(--surface); border:1px solid var(--line); border-radius:6px; overflow:hidden}
.box-h{display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line);
  font-size:15px; font-weight:800}
.box-h .tag{font-size:11px; color:#fff; background:var(--accent); border-radius:3px; padding:1px 7px}
.hero{display:grid; grid-template-columns:170px minmax(0,1fr); gap:14px; padding:14px; cursor:pointer}
@media(max-width:480px){.hero{grid-template-columns:110px minmax(0,1fr)}}
.hero .thumb{aspect-ratio:1/1; border-radius:4px}
.hero .hl{font-size:17px; font-weight:800; line-height:1.4; margin:2px 0 8px; text-wrap:balance}
.hero .meta{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:12px; color:var(--muted)}
.headline{list-style:none; margin:0; padding:4px 14px 10px}
.headline li{padding:7px 0; border-top:1px solid var(--line); display:flex; gap:8px; align-items:baseline}
.headline li:first-child{border-top:0}
.headline .dot{color:var(--accent); font-weight:800}
.headline .d{margin-left:auto; color:var(--muted); font-size:11.5px; white-space:nowrap}
.hrow{display:flex; gap:10px; overflow-x:auto; padding:14px; scrollbar-width:thin}
.hcard{flex:0 0 128px; min-width:0}
.hcard .thumb{width:128px; height:128px; border-radius:4px}
.hcard .t{font-size:12px; font-weight:600; line-height:1.35; margin-top:6px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.hcard .d{font-size:11px; color:var(--muted); margin-top:2px}
.dense{list-style:none; margin:0; padding:0}
.dense li{display:flex; gap:10px; padding:10px 14px; border-top:1px solid var(--line); align-items:center; cursor:pointer}
.dense .thumb{flex:0 0 52px; width:52px; height:52px; border-radius:4px}
.dense .t{font-size:13px; font-weight:600; line-height:1.4;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.dense .sub{font-size:11.5px; color:var(--muted); margin-top:1px}
.rail .box{margin-bottom:16px}
.cal{padding:6px 14px 12px}
.cal-d{font-size:12px; font-weight:800; color:var(--accent); margin:10px 0 4px}
.cal-i{font-size:12.5px; padding:3px 0 3px 10px; border-left:2px solid var(--line); margin-left:2px}
.stats{display:flex; gap:0; text-align:center; padding:12px 8px}
.stats div{flex:1}
.stats .n{font-size:22px; font-weight:800}
.stats .l{font-size:11px; color:var(--muted)}
.lotlist{list-style:none; margin:0; padding:6px 14px 12px}
.lotlist li{padding:5px 0; border-top:1px solid var(--line); font-size:12.5px}
.lotlist li:first-child{border-top:0}
.lotlist a{color:var(--indigo); font-weight:600}
.lotlist a:hover{text-decoration:underline}

/* ── 日付グループ見出し（案B・案C 共通。折りたたみ可能なボタン。
   2026-08-08追加: 開閉トグル。デフォルト状態は日付グループ・日付未定=展開／
   月グループ(「◯年◯月発売予定」)=折りたたみ（JS側isSectionCollapsed()参照。
   縦長化の主因のため）。タップ領域はモバイル390px幅でも44px以上を確保する
   ためmin-height:44pxを明示する（見た目のpaddingだけに頼らない） ── */
.dsec{appearance:none; font-family:inherit; font-size:inherit; border:0; background:none;
  padding:0; text-align:left; color:inherit; cursor:pointer; width:100%; min-height:44px;
  box-sizing:border-box; margin:22px 0 10px; display:flex; align-items:center; gap:10px}
.dsec:first-child{margin-top:0}
.dsec:hover{background:var(--tint)}
.dsec:focus-visible{outline:2px solid var(--indigo); outline-offset:2px}
.dsec .dsec-toggle{flex:0 0 auto; font-size:11px; color:var(--muted); display:inline-block;
  transition:transform .12s ease}
.dsec[aria-expanded="true"] .dsec-toggle{transform:rotate(90deg)}
.dsec .name{font-size:14px; font-weight:800; white-space:nowrap}
.dsec .rule{height:1px; background:var(--line); flex:1}
.dsec .cnt{font-size:12px; color:var(--muted); white-space:nowrap}
/* 折りたたみ対象の商品群のラッパー。display:contentsで自身は箱を作らず、
   中身（.card/.frow）をそのまま親（.grid/.flist）の直接の子として扱わせる
   ことで、CSS Gridのカラム計算・flistの罫線ロジックに影響を与えない
   （既存の :first-child セレクタは見出し(.dsec)自体が常に非ラップのため
   影響を受けない。詳細はlogs/build-report-20260808-collapse.md参照）。
   .collapsed時のみdisplay:noneで丸ごと非表示にする（子のimg[data-src]も
   非レンダリングになりIntersectionObserverが自動的にisIntersecting:false
   を返す＝遅延読み込みが走らない。展開時にtoggleSection/jumpToSectionが
   observeLazyImages()を呼び直すことで読み込みを保証する） */
.dsec-items{display:contents}
.dsec-items.collapsed{display:none}

/* ════ 案B ストア ════ */
.pB .filters{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px}
.pB .filters button, .cattabs button{appearance:none; font-family:inherit; cursor:pointer; font-size:13px;
  font-weight:600; padding:6px 14px; border-radius:999px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink)}
.pB .filters button.on, .cattabs button.on{background:var(--indigo); border-color:var(--indigo); color:#fff}
.pB .filters button:focus-visible, .cattabs button:focus-visible{outline:2px solid var(--indigo); outline-offset:2px}
.pB .filters .grouptoggle{margin-left:auto}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(185px,1fr)); gap:14px}
.grid .dsec{grid-column:1/-1}
.card{background:var(--surface); border:1px solid var(--line); border-radius:8px; overflow:hidden;
  display:flex; flex-direction:column; transition:transform .12s ease, box-shadow .12s ease; cursor:pointer}
@media(prefers-reduced-motion:no-preference){
  .card:hover{transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.10)}
}
.card .imgbox{position:relative; aspect-ratio:1/1}
.card .thumb{width:100%; height:100%}
.card .ph{width:100%; height:100%}
.card .bdg{position:absolute; top:8px; left:8px; display:flex; flex-direction:column; gap:4px; align-items:flex-start}
.card .body{padding:10px 12px 12px; display:flex; flex-direction:column; gap:4px; flex:1}
.card .t{font-size:13px; font-weight:700; line-height:1.4;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.card .mk{font-size:11.5px; color:var(--muted)}
.card .foot{margin-top:auto; display:flex; justify-content:space-between; align-items:baseline; padding-top:6px}
.card .dt{font-size:12px; color:var(--muted)}
.card .pr{font-size:14px; font-weight:800}

/* ════ 案C 朝刊フィード ════ */
.pC{max-width:560px; margin:0 auto}
.pC .mh{text-align:center; padding:6px 0 18px}
.pC .mh .l1{font-size:12px; letter-spacing:.25em; color:var(--muted); font-weight:700}
.pC .mh .l2{font-size:24px; font-weight:800; margin-top:2px}
.pC .sec{margin:26px 0 10px; display:flex; align-items:center; gap:10px}
.pC .sec .name{font-size:16px; font-weight:800; white-space:nowrap}
.pC .sec .rule{height:1px; background:var(--line); flex:1}
.pC .sec .cnt{font-size:12px; color:var(--muted); white-space:nowrap}
.fcard{background:var(--surface); border:1px solid var(--line); border-radius:10px;
  overflow:hidden; margin-bottom:14px; display:block; cursor:pointer}
.fcard .thumb{aspect-ratio:16/9; width:100%}
.fcard .body{padding:12px 14px 14px}
.fcard .t{font-size:16px; font-weight:800; line-height:1.4; text-wrap:balance}
.fcard .meta{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px}
.fcard .att{margin-left:auto; display:flex; gap:3px; align-items:center}
.fcard .att i{width:8px; height:8px; border-radius:2px; background:var(--line)}
.fcard .att i.f{background:var(--accent)}
.fcard .att span{font-size:11px; color:var(--muted); margin-right:2px}
.flist{background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.flist .frow{display:flex; gap:12px; padding:11px 14px; border-top:1px solid var(--line); align-items:center; cursor:pointer}
.flist .frow:first-child{border-top:0}
.flist .dsec{margin:0; padding:10px 14px 4px; border-top:1px solid var(--line)}
.flist .dsec:first-child{border-top:0; padding-top:12px}
.flist .thumb{flex:0 0 56px; width:56px; height:56px; border-radius:6px}
.flist .t{font-size:13.5px; font-weight:700; line-height:1.4;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.flist .sub{font-size:11.5px; color:var(--muted); margin-top:2px}

/* ── 抽選・予約サイト（案B/案C 末尾のコンパクトリンク集） ── */
.lotcompact{margin-top:24px; padding-top:14px; border-top:1px solid var(--line);
  font-size:12px; color:var(--muted); display:flex; flex-wrap:wrap; align-items:center; gap:2px}
.lotcompact .ttl{font-weight:800; color:var(--ink); margin-right:6px}
.lotcompact a{color:var(--indigo); font-weight:600}
.lotcompact a:hover{text-decoration:underline}
.lotcompact .sep{margin:0 4px; color:var(--line)}

.foot-note{margin-top:36px; text-align:center; color:var(--muted); font-size:12px}

/* ── 商品詳細モーダル（カード/行クリックで開く。1個をJSで使い回す） ── */
.modal-overlay{position:fixed; inset:0; background:rgba(20,22,28,.55); z-index:1000;
  display:flex; align-items:flex-end; justify-content:center; padding:0}
.modal-overlay[hidden]{display:none}
@media(min-width:640px){
  .modal-overlay{align-items:center; padding:20px}
}
.modal-sheet{background:var(--surface); color:var(--ink); width:100%; max-width:560px;

// 祖先の .tlink{display:contents} 配下ではChromeのネイティブ loading="lazy" が
// 初回スクロールまで発火しない不具合が実機確認されたため、data-src属性＋
// IntersectionObserverによる遅延読み込みに置き換える。renderA/renderGridB/
// renderC/openModal など、thumb()の出力をDOMへ書き込む箇所は必ず末尾で
// observeLazyImages()を呼ぶこと（新規に増えたimg[data-src]を監視対象に追加する）。
let lazyImgObserver = null;

  if(lazyImgObserver) lazyImgObserver.disconnect();
  if(!imgs.length) return;
  if(!lazyImgObserver){
    lazyImgObserver = new IntersectionObserver(function(entries, obs){
      entries.forEach(function(entry){
        if(!entry.isIntersecting) return;
        loadLazyImg(entry.target);
        obs.unobserve(entry.target);
      });

  // 毎回いったん全解除し、現在DOM上にある未読込<img data-src>だけを張り直す
  // （読み込み済みはdata-srcが外れておりセレクタに一致しない）。
  imgs.forEach(function(img){ lazyImgObserver.observe(img); });

function att(it){ // 注目度 0-3
  const d = days(it); let n = 0;
  if(d !== null && d >= 0 && d <= 3) n = 3;

  else if(d !== null && Math.abs(d) <= 14) n = 1;
  if(it.kind !== "発売") n = Math.min(3, n + 1);
  return n;
}

function computeSoon(list){
  return list.filter(i => {const d = days(i); return d !== null && d >= 0 && d <= 14;})
             .sort((a,b) => days(a) - days(b));
}
function computeRel(list){
  return list.filter(i => {const d = days(i); return d !== null && d < 0;})
             .sort((a,b) => days(b) - days(a));
}
function computeFeatured(list){
  return [...list].sort((a,b) => att(b) - att(a) || (days(a)??99) - (days(b)??99));
}
function computeNewest(list){
  // 新着ヘッドライン: 初回検出日が基準日から3日以内のアイテムを新しい順に最大20件
  return list.filter(i => {const ds = daysSince(i.first_seen); return ds !== null && ds >= 0 && ds <= 3;})
             .sort((a,b) => daysSince(a.first_seen) - daysSince(b.first_seen))
             .slice(0, 20);
}

function fmtISO(d){
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function applyDateShortcut(kind){
  if(kind === "clear"){
    dateFrom = ""; dateTo = "";
  } else if(kind === "week"){
    const day = TODAY.getDay(); // 0=日曜
    const mondayOffset = day === 0 ? -6 : 1 - day;
    const monday = new Date(TODAY); monday.setDate(TODAY.getDate() + mondayOffset);
    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    dateFrom = fmtISO(monday); dateTo = fmtISO(sunday);
  } else if(kind === "month"){
    const first = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
    const last = new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, 0);
    dateFrom = fmtISO(first); dateTo = fmtISO(last);
  } else if(kind === "14d"){
    const end = new Date(TODAY); end.setDate(TODAY.getDate() + 14);
    dateFrom = fmtISO(TODAY); dateTo = fmtISO(end);
  }
  const fromEl = document.getElementById("fbFrom");
  const toEl = document.getElementById("fbTo");
  if(fromEl) fromEl.value = dateFrom;
  if(toEl) toEl.value = dateTo;
  saveExtraFilters();
  renderAll();
}

/* ── 日付グループ化（案B・案C 共通） ── */
const WD_JA = ["日","月","火","水","木","金","土"]; // Date.getDay() 0=日曜 起点
function isFullDate(s){
  return /^\d{4}-\d{2}-\d{2}$/.test(s || "");
}
// フィギュア系ソース（プレバン・グッスマ等）は発売日が「YYYY-MM」（月まで）
// までしか判明していない商品がある。フル日付("YYYY-MM-DD")と区別して
// 専用の月グループにまとめる（"未定"・空・パース不能な値はここに含めない＝
// 従来通り undated 行き。isFullDate/isMonthOnlyのどちらにも一致しない値だけが
// undated に残る）。
function isMonthOnly(s){
  return /^\d{4}-\d{2}$/.test(s || "");
}
function dateGroupLabel(dateStr){
  // 呼び出し側は isFullDate() で絞り込んだ "YYYY-MM-DD" のみを渡す前提
  const d = parseDate(dateStr);
  if(!d) return dateStr;
  return `${dateStr}（${WD_JA[d.getDay()]}）`;
}
function monthGroupLabel(ym){
  // 呼び出し側は isMonthOnly() で絞り込んだ "YYYY-MM" のみを渡す前提
  const m = /^(\d{4})-(\d{2})$/.exec(ym);
  if(!m) return ym;
  return `${+m[1]}年${+m[2]}月発売予定`;
}
function groupItemsByDate(list){
  // フル日付("YYYY-MM-DD")は日付ごとに、月のみ判明("YYYY-MM")は月ごとに束ねる。
  // それ以外("未定"/空/パース不能)は「日付未定」グループへ最後にまとめる
  // （"未定"の扱いは従来通り変更しない）。
  const groups = {};
  const monthGroups = {};
  const undated = [];
  list.forEach(i => {
    const v = dateField(i); // lottery.htmlではlottery_deadline基準（dateField参照）
    if(isFullDate(v)) (groups[v] = groups[v] || []).push(i);
    else if(isMonthOnly(v)) (monthGroups[v] = monthGroups[v] || []).push(i);
    else undated.push(i);
  });
  // 日付グループと月グループを時系列で1本の並びにする。月グループの並び順は
  // 「その月の日付グループの末尾」に来るよう、ソートキーに疑似的な日として
  // "-99"（実在する最大の日"31"より大きく、翌月の"01"より確実に手前になる）を
  // 付与する。全キーが同じ桁数の数字文字列（YYYY-MM-DD/YYYY-MM-99）になるため
  // 文字列比較のままで時系列ソートとして成立する。
  const ordered = Object.keys(groups).map(d => ({ kind: "date", key: d, sortKey: d }))
    .concat(Object.keys(monthGroups).map(ym => ({ kind: "month", key: ym, sortKey: ym + "-99" })))
    .sort((a, b) => a.sortKey < b.sortKey ? -1 : a.sortKey > b.sortKey ? 1 : 0);
  return { ordered, groups, monthGroups, undated };
}
// ── 日付グループの開閉（折りたたみ）── 2026-08-08追加。
// 保存はしない（毎朝データが総入れ替えされるため、開閉状態を永続化する意味が
// 薄い。ページを開き直すたびデフォルト状態にリセットされる仕様。設計判断は
// logs/build-report-20260808-collapse.md参照）。ページ内ではsectionCollapse
// （個別トグルの明示的な上書き）とcollapseAllMode（「全て開く／全て折りたたむ」
// の一括モード）をJS変数として保持する。idは「idPrefix-日付orYYYY-MM」で
// 安定しているため、絞り込み変更でrenderGridB/renderCが再実行されても
// 同じグループには同じ開閉状態が再現され、破綻しない。
let sectionCollapse = {}; // id -> boolean（明示トグル済みのものだけ持つ）
let collapseAllMode = null; // null（種類別デフォルト）|"collapsed"|"expanded"
function defaultCollapsedForKind(kind){
  // 既定: 日付グループ・日付未定=展開、月グループ（月精度しか分からない
  // フィギュア系商品の「◯年◯月発売予定」）=折りたたみ（縦長化の主因のため）。
  return kind === "month";
}
function isSectionCollapsed(id, kind){
  if(Object.prototype.hasOwnProperty.call(sectionCollapse, id)) return sectionCollapse[id];
  if(collapseAllMode === "collapsed") return true;
  if(collapseAllMode === "expanded") return false;
  return defaultCollapsedForKind(kind);
}
function sectionHeaderHtml(id, label, count, kind){
  const collapsed = isSectionCollapsed(id, kind);

    + `<span class="name num">${esc(label)}</span>`

function sectionItemsHtml(id, bucket, itemHtmlFn, kind){

// 見出しボタンのクリックで呼ばれる。DOM操作のみ（class付け替え＋aria-expanded）で
// renderGridB/renderCの再実行はしない（軽量・確実。335件級の月グループでも
// 文字列再生成が発生しない）。展開時はobserveLazyImages()を呼び直し、
// 折りたたみ中は監視対象から外れていた（display:noneのため交差判定されない）
// 画像を確実に読み込ませる。
function toggleSection(id){
  const wrap = document.getElementById(id + "-items");
  const btn = document.getElementById(id);
  if(!wrap || !btn) return;
  const willCollapse = !wrap.classList.contains("collapsed");
  wrap.classList.toggle("collapsed", willCollapse);

  sectionCollapse[id] = willCollapse;

}
// 上部「全て開く／全て折りたたむ」ボタン（renderFilterBar参照）。個別トグルの
// 上書き(sectionCollapse)はクリアして一括モードに揃え、以後（次のフィルタ
// 変更で新しく現れるグループも含め）全グループに一律で適用する。表示中の
// 案B・案Cのみ再描画する（案Aは日付グループ表示を持たないため対象外。
// 案Aの構造確認・適用可否の判断はlogs/build-report-20260808-collapse.md参照）。
function setCollapseAllMode(mode){
  collapseAllMode = mode;
  sectionCollapse = {};
  renderGridB();
  renderC();
}
// groupItemsByDate()の戻り値(g)を1回だけ計算し、本文HTML（renderDateSectionsFromGroups）
// と日付ジャンプ目次（renderJumpNavFromGroups）の両方に渡すことで、同じ集計を
// 2回計算して結果がずれる事故を防ぐ（呼び出し側は必ずgを使い回すこと）。
// idPrefix: 案B("secB")／案C("secC")でアンカーIDの名前空間を分ける
// （案B・案Cは常に両方DOM上に存在し、hidden属性で表示切替するだけのため、
// 同じ日付キーでもidが衝突しないようにする必要がある）。
function renderDateSectionsFromGroups(g, itemHtmlFn, idPrefix){
  const { ordered, groups, monthGroups, undated } = g;
  let html = "";
  ordered.forEach(o => {
    const bucket = o.kind === "date" ? groups[o.key] : monthGroups[o.key];
    const label = o.kind === "date" ? dateGroupLabel(o.key) : monthGroupLabel(o.key);
    const id = `${idPrefix}-${o.key}`;
    html += sectionHeaderHtml(id, label, bucket.length, o.kind);
    html += sectionItemsHtml(id, bucket, itemHtmlFn, o.kind);
  });
  if(undated.length){
    const id = `${idPrefix}-undated`;
    html += sectionHeaderHtml(id, "日付未定", undated.length, "undated");
    html += sectionItemsHtml(id, undated, itemHtmlFn, "undated");
  }
  return html;
}
// 日付ジャンプ目次（折りたたみ式）。renderDateSectionsFromGroupsと同じidPrefix・
// 同じ集計結果(g)から作るため、目次の項目数・件数は本文の見出しと必ず一致する。
// グループが1件も無ければ目次自体を出さない（絞り込みで0件になった場合等）。
function renderJumpNavFromGroups(g, idPrefix){
  const { ordered, groups, monthGroups, undated } = g;
  const items = ordered.map(o => {
    const bucket = o.kind === "date" ? groups[o.key] : monthGroups[o.key];
    const label = o.kind === "date" ? dateGroupLabel(o.key) : monthGroupLabel(o.key);
    return { id: `${idPrefix}-${o.key}`, label: label, count: bucket.length };
  });
  if(undated.length) items.push({ id: `${idPrefix}-undated`, label: "日付未定", count: undated.length });
  if(!items.length) return "";
  return `<details class="datejump">
    <summary>日付ジャンプ<span class="num">（${items.length}）</span></summary>
    <div class="datejump-list">
      ${items.map(it => `<button type="button" class="datejump-btn" onclick="jumpToSection('${esc(it.id)}')">${esc(it.label)} <span class="num">${it.count}件</span></button>`).join("")}
    </div>
  </details>`;
}
function jumpToSection(id){
  // 折りたたみ中のグループへジャンプした場合は自動で展開してからスクロール
  // する（toggleSectionと同じDOM操作。既に開いている場合は何もしない）。
  const wrap = document.getElementById(id + "-items");
  if(wrap && wrap.classList.contains("collapsed")){
    wrap.classList.remove("collapsed");
    const btn = document.getElementById(id);
    if(btn) btn.setAttribute("aria-expanded", "true");
    sectionCollapse[id] = false;
    observeLazyImages();
  }
  const el = document.getElementById(id);
  if(el) el.scrollIntoView({ behavior: "smooth", block: "start" });
}

/* ── 案B ── */
let filterB = "all";
let groupB = "date"; // 既定は「日付ごと」。localStorage(rw_group)で記憶
function setFilter(f, btn){
  filterB = f;
  document.querySelectorAll(".pB .filters .catbtn").forEach(b => b.classList.remove("on"));
  btn.classList.add("on");
  renderGridB();
}
function toggleGroupB(){
  groupB = groupB === "date" ? "flat" : "date";
  try{ localStorage.setItem("rw_group", groupB); }catch(e){}
  const btn = document.getElementById("groupToggleB");
  if(btn){
    btn.textContent = groupB === "date" ? "日付ごと" : "一覧";
    btn.classList.toggle("on", groupB === "date");
  }
  renderGridB();
}
function cardHtml(i){
  // カード全体を<a>にすると検索リンク列（別の<a>）を内包できないため、
  // ラッパーはdivにし、画像とタイトルをそれぞれ商品ページへのリンクにする。
  // カード自体のクリック（リンク以外の領域）で商品詳細モーダルを開く。
  return `
    <div class="card" data-key="${esc(i.key)}" onclick="handleCardClick(event)">
      <div class="imgbox"><a class="tlink" href="${esc(i.url)}" target="_blank" rel="noopener">${thumb(i)}</a><div class="bdg">${chips(i, false)}</div></div>
      <div class="body">
        <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a></div>
        <div class="mk">${esc(i.cat)}｜${esc(i.maker || "メーカー不明")}</div>
        <div class="foot"><span class="dt num">${esc(fmtDate(i))}</span><span class="pr num">${fmtPrice(i)}</span></div>
        ${searchLinks(i)}
        ${lotteryLinksRow(i)}
        ${manualLinksRow(i)}
      </div>
    </div>`;
}
function gridBList(){
  // トレカ/フィギュア/くじの絞り込みはページ共通の.cattabs（catFilter）、
  // 期間・キャラクター・キーワードはcurrentData()に統合済みのため、
  // ここでは案B独自の日付・予約種別サブ絞り込みのみ行う。
  const base = currentData();
  let list = base;
  if(filterB === "soon") list = computeSoon(base);
  if(filterB === "yoyaku") list = base.filter(i => i.kind === "予約" || i.kind === "抽選");
  if(filterB === "rel") list = computeRel(base);
  return list;
}
// #gridB（商品カード）と#jumpNavB（日付ジャンプ目次）を同じ集計から一括更新する。
// setFilter/toggleGroupB/renderAll（extra filters変更時）のいずれからも呼ばれる。
function renderGridB(){
  const gridEl = document.getElementById("gridB");
  const navEl = document.getElementById("jumpNavB");
  if(!gridEl) return;
  const list = gridBList();
  if(!list.length){
    gridEl.innerHTML = `<p style="color:var(--muted)">該当する商品はありません。</p>`;
    if(navEl) navEl.innerHTML = "";
    return;
  }
  if(groupB !== "date"){
    gridEl.innerHTML = list.map(cardHtml).join("");
    if(navEl) navEl.innerHTML = ""; // 一覧表示中は日付グループが無いため目次も出さない
    observeLazyImages();
    return;
  }
  const g = groupItemsByDate(list);
  gridEl.innerHTML = renderDateSectionsFromGroups(g, cardHtml, "secB");
  if(navEl) navEl.innerHTML = renderJumpNavFromGroups(g, "secB");
  observeLazyImages();
}
function renderB(){
  const el = document.getElementById("vB");
  if(!currentData().length){ el.innerHTML = `<p style="color:var(--muted)">データがありません。</p>`; return; }
  const isLottery = PAGE_MODE === "lottery";
  el.innerHTML = `
    <div class="filters">
      <button class="catbtn on" onclick="setFilter('all', this)">すべて</button>
      <button class="catbtn" onclick="setFilter('soon', this)">${isLottery ? "締切間近" : "もうすぐ発売"}</button>
      <button class="catbtn" onclick="setFilter('yoyaku', this)">予約・抽選</button>
      <button class="catbtn" onclick="setFilter('rel', this)">${isLottery ? "締切済み" : "発売中"}</button>
      <button id="groupToggleB" class="grouptoggle${groupB === "date" ? " on" : ""}" onclick="toggleGroupB()">${groupB === "date" ? "日付ごと" : "一覧"}</button>
    </div>
    <div id="jumpNavB"></div>
    <div class="grid" id="gridB"></div>
    ${lotteryCompactHtml()}`;
  renderGridB();
}

/* ── 案C ── */
function attBar(it){
  const n = att(it);
  return `<span class="att"><span>注目度</span>${[0,1,2].map(k => `<i class="${k < n ? "f" : ""}"></i>`).join("")}</span>`;
}
function flistItemHtml(i){
  // 行全体を<a>にすると検索リンク列を内包できないため、ラッパーはdiv(.frow)にし、
  // 画像とタイトルをそれぞれ商品ページへのリンクにする。行のクリック
  // （リンク以外の領域）で商品詳細モーダルを開く。
  return `<div class="frow" data-key="${esc(i.key)}" onclick="handleCardClick(event)">`
    + `<a class="tlink" href="${esc(i.url)}" target="_blank" rel="noopener">${thumb(i)}</a>`
    + `<div style="min-width:0">`
    + `<div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a></div>`
    + `<div class="sub">${esc(i.cat)}｜<span class="num">${esc(fmtDate(i))}</span>｜${fmtPrice(i) || "価格未定"}</div>`
    + `${searchLinks(i)}`
    + `${lotteryLinksRow(i)}`
    + `${manualLinksRow(i)}`
    + `</div></div>`;
}
function renderC(){
  const el = document.getElementById("vC");
  const list = currentData();
  if(!list.length){ el.innerHTML = `<p style="color:var(--muted)">データがありません。</p>`; return; }
  const featured = computeFeatured(list);
  const top = featured.filter(i => i.img).slice(0, 3);
  const rest = list.filter(i => !top.includes(i)).slice(0, 30);
  const g = groupItemsByDate(rest);
  el.innerHTML = `
    <div class="mh"><div class="l1">MORNING EDITION</div><div class="l2">8月8日（土）の朝刊</div></div>
    <div class="sec"><span class="name">今日の注目</span><span class="rule"></span><span class="cnt num">${top.length}件</span></div>
    ${top.map(i => `
      <div class="fcard" data-key="${esc(i.key)}" onclick="handleCardClick(event)">
        <a class="tlink" href="${esc(i.url)}" target="_blank" rel="noopener">${thumb(i)}</a>
        <div class="body">
          <div class="t"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a></div>
          <div class="meta">${chips(i, true)}<b class="num">${fmtPrice(i)}</b>${attBar(i)}</div>
          ${searchLinks(i)}
          ${lotteryLinksRow(i)}
          ${manualLinksRow(i)}
        </div>
      </div>`).join("")}
    <div class="sec"><span class="name">${PAGE_MODE === "lottery" ? "新着・締切予定" : "新着・発売予定"}</span><span class="rule"></span><span class="cnt num">${rest.length}件</span></div>
    <div id="jumpNavC">${renderJumpNavFromGroups(g, "secC")}</div>
    <div class="flist">
      ${renderDateSectionsFromGroups(g, flistItemHtml, "secC")}
    </div>
    ${lotteryCompactHtml()}`;
  observeLazyImages();
}

/* ── 商品詳細モーダル ── */
function modalDetailRow(label, value){
  if(!value) return ""; // 値が無い項目は行自体を出さない（予約開始/抽選締切など）
  return `<div class="modal-row"><span class="modal-label">${esc(label)}</span><span class="modal-value">${esc(value)}</span></div>`;
}
function modalLinksHtml(item){
  // リンク集: 商品ページを開く／メルカリ／Amazon／楽天／eBay／eBayリサーチ／
  // （トレカ/抽選のみ）相場グラフサイト／
  // 🔖手動登録の予約リンク（config/manual_links.json。あれば。noteがあれば
  // リンク横に小さく表示）／🎯verified抽選予約リンク（あれば）／
  // 🔍 Googleで探す
  const title = item.title;
  const q = encodeURIComponent((title || "").slice(0, 40));
  const eq = encodeURIComponent(item.en_q ? item.en_q : extractEbayQuery(title));
  const verifiedLottery = (item.lottery || []).filter(l => l.verified);
  let html = `<div class="modal-links">`;
  html += `<a class="modal-link primary" href="${esc(item.url)}" target="_blank" rel="noopener">商品ページを開く</a>`;
  html += `<a class="modal-link" href="https://jp.mercari.com/search?keyword=${q}" target="_blank" rel="noopener">メルカリ</a>`;
  html += `<a class="modal-link" href="https://www.amazon.co.jp/s?k=${q}" target="_blank" rel="noopener">Amazon</a>`;
  html += `<a class="modal-link" href="https://search.rakuten.co.jp/search/mall/${q}/" target="_blank" rel="noopener">楽天</a>`;
  html += `<a class="modal-link" href="https://www.ebay.com/sch/i.html?_nkw=${eq}" target="_blank" rel="noopener">eBay</a>`;
  html += `<a class="modal-link" href="${ebayResearchUrl(eq)}" target="_blank" rel="noopener">eBayリサーチ</a>`;
  const soba = sobaLinkInfo(item);
  if(soba) html += `<a class="modal-link" href="${soba[1]}" target="_blank" rel="noopener">${soba[0]}</a>`;
  (item.manual_links || []).forEach(l => {
    const note = l.note ? `<span class="modal-link-note">${esc(l.note)}</span>` : "";
    html += `<span class="modal-link-wrap"><a class="modal-link manual" href="${esc(l.url)}" target="_blank" rel="noopener">🔖 ${esc(l.label)}</a>${note}</span>`;
  });
  verifiedLottery.forEach(l => {
    html += `<a class="modal-link accent" href="${esc(l.url)}" target="_blank" rel="noopener">🎯 ${esc(l.site)}</a>`;
  });
  html += `<a class="modal-link muted" href="${googleLotterySearchUrl(item)}" target="_blank" rel="noopener">🔍 抽選・予約をGoogleで探す</a>`;
  html += `</div>`;
  return html;
}
function modalContentHtml(item){
  return `
    <div class="modal-thumb">${thumb(item)}</div>
    <h2 id="modalTitle" class="modal-title">${esc(item.title)}</h2>
    <div class="modal-chips">${chips(item, true)}</div>
    <div class="modal-details">
      ${modalDetailRow("カテゴリ", item.cat)}
      ${modalDetailRow("種別", item.kind)}
      ${modalDetailRow("メーカー", item.maker)}
      ${modalDetailRow("発売日", item.date ? fmtDate(item) : "")}
      ${modalDetailRow("予約開始", item.preorder_start)}
      ${modalDetailRow("抽選締切", item.lottery_deadline)}
      ${modalDetailRow("価格", fmtPrice(item))}
    </div>
    ${modalLinksHtml(item)}`;
}
function openModal(item){
  const overlay = document.getElementById("modalOverlay");
  const body = document.getElementById("modalBody");
  if(!overlay || !body) return;
  body.innerHTML = modalContentHtml(item);
  observeLazyImages();
  overlay.hidden = false;
  document.body.style.overflow = "hidden"; // 開いている間は背景をスクロールさせない
  const closeBtn = document.getElementById("modalClose");
  if(closeBtn) closeBtn.focus(); // フォーカス管理は簡易に：閉じるボタンへ
}
function closeModal(){
  const overlay = document.getElementById("modalOverlay");
  if(!overlay || overlay.hidden) return;
  overlay.hidden = true;
  document.body.style.overflow = "";
}
function openModalByKey(key){
  const item = KEY_TO_ITEM[key];
  if(item) openModal(item);
}
function handleCardClick(e){
  // カード/行の内部リンク（画像・タイトル・検索リンク等）のクリックでは
  // モーダルを開かない（リンク自身の遷移を優先する）
  if(e.target.closest("a")) return;
  const key = e.currentTarget.getAttribute("data-key");
  if(key) openModalByKey(key);
}
function handleOverlayClick(e){
  // オーバーレイの背景部分（シート自体ではない）をクリックしたときだけ閉じる
  if(e.target.id === "modalOverlay") closeModal();
}
document.addEventListener("keydown", function(e){
  if(e.key === "Escape") closeModal();
});

function show(v){
  for(const k of ["A","B","C"]){
    document.getElementById("v"+k).hidden = (k !== v);
    document.getElementById("b"+k).classList.toggle("on", k === v);
  }
  try{ localStorage.setItem("rw_view", v); }catch(e){}
}

function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  try{ localStorage.setItem("rw_theme", t); }catch(e){}
  const btn = document.getElementById("themeToggle");
  if(btn) btn.textContent = t === "dark" ? "☀ ライト" : "🌙 ダーク";
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  applyTheme(cur === "dark" ? "light" : "dark");
}
(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem("rw_theme"); }catch(e){}
  if(saved === "light" || saved === "dark"){
    applyTheme(saved);
  } else {
    const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    const btn = document.getElementById("themeToggle");
    if(btn) btn.textContent = prefersDark ? "☀ ライト" : "🌙 ダーク";
  }
})();

// ── トップへ戻るボタン ──
// 1画面分（window.innerHeight、下限400px）を超えて下スクロールしたら表示する。
// スムーズスクロールはprefers-reduced-motionを尊重してauto/smoothを切り替える。
function scrollToTop(){
  const reduceMotion = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.scrollTo({top:0, left:0, behavior: reduceMotion ? "auto" : "smooth"});
}
(function initBackToTop(){
  const btn = document.getElementById("backToTop");
  if(!btn) return;
  function threshold(){ return Math.max(window.innerHeight || 0, 400); }
  function onScroll(){
    btn.classList.toggle("show", (window.scrollY || window.pageYOffset || 0) > threshold());
  }
  window.addEventListener("scroll", onScroll, {passive:true});
  window.addEventListener("resize", onScroll, {passive:true});
  onScroll();
})();

try{
  // 有効な絞り込み値は「このページに実在するcattabsボタンのdata-cat」から
  // 動的に判定する（ページ種別ごとに語彙が違うため、固定リストで決め打ちしない）。
  const validCats = Array.from(document.querySelectorAll(".cattabs button")).map(b => b.getAttribute("data-cat"));
  const savedCat = localStorage.getItem(catStorageKey());
  if(savedCat !== null && validCats.indexOf(savedCat) !== -1) catFilter = savedCat;
}catch(e){}
document.querySelectorAll(".cattabs button").forEach(b => {
  b.classList.toggle("on", b.getAttribute("data-cat") === catFilter);
});

try{
  const savedGroup = localStorage.getItem("rw_group");
  if(savedGroup === "date" || savedGroup === "flat") groupB = savedGroup;
}catch(e){}

loadExtraFilters();
renderFilterBar();
renderAll();
// lottery.html は「締切昇順で一覧表示」が主目的のため、初回表示（未保存時）は
// 日付グループ表示が既定の案B（ストア）を初期ビューにする。他ページは従来通り
// 案A（ポータル）。ユーザーが一度でも表示を切り替えれば以後はlocalStorage(rw_view)
// が優先される（下のtryブロックで上書きされる）。
let initialView = PAGE_MODE === "lottery" ? "B" : "A";
try{
  const savedView = localStorage.getItem("rw_view");
  if(savedView === "A" || savedView === "B" || savedView === "C") initialView = savedView;
}catch(e){}
show(initialView);
</script>
