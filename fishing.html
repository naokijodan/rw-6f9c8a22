<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>新商品ウォッチ</title>
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#1B2330; --muted:#5A6474;
  --line:#E2E6EB; --accent:#D7263D; --indigo:#2B4C8C; --amber:#B26E0A;
  --green:#2E7D5B; --purple:#7B4FA6; --tint:#EDF0F4;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12161E; --surface:#1A202B; --ink:#E8EBF0; --muted:#98A2B3;
    --line:#2A3140; --accent:#F0455C; --indigo:#8CA9E0; --amber:#E0A44B;
    --green:#5CB48E; --purple:#B08BD8; --tint:#232A37;
  }
}
:root[data-theme="dark"]{
  --bg:#12161E; --surface:#1A202B; --ink:#E8EBF0; --muted:#98A2B3;
  --line:#2A3140; --accent:#F0455C; --indigo:#8CA9E0; --amber:#E0A44B;
  --green:#5CB48E; --purple:#B08BD8; --tint:#232A37;
}
:root[data-theme="light"]{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#1B2330; --muted:#5A6474;
  --line:#E2E6EB; --accent:#D7263D; --indigo:#2B4C8C; --amber:#B26E0A;
  --green:#2E7D5B; --purple:#7B4FA6; --tint:#EDF0F4;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
a{color:inherit; text-decoration:none}
a:hover .hl, .headline a:hover, .hl a:hover{text-decoration:underline}
img{max-width:100%}
.num{font-variant-numeric:tabular-nums}

/* ── マストヘッド ── */
.mast{background:var(--surface); border-bottom:1px solid var(--line)}
.mast-in{max-width:1080px; margin:0 auto; padding:14px 16px;
  display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 16px}
.brand{font-size:22px; font-weight:800; letter-spacing:.02em}
.brand b{color:var(--accent)}
.today{color:var(--muted); font-size:12.5px}
.switch{display:flex; gap:0; margin-left:auto; border:1px solid var(--line);
  border-radius:6px; overflow:hidden}
.switch button{appearance:none; border:0; background:var(--surface); color:var(--muted);
  padding:7px 14px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit}
.switch button+button{border-left:1px solid var(--line)}
.switch button.on{background:var(--ink); color:var(--bg)}
.switch button:focus-visible{outline:2px solid var(--indigo); outline-offset:-2px}
.theme-toggle{appearance:none; border:1px solid var(--line); border-radius:6px;
  background:var(--surface); color:var(--muted); padding:7px 10px; font-size:13px;
  font-weight:600; cursor:pointer; font-family:inherit}
.theme-toggle:focus-visible{outline:2px solid var(--indigo); outline-offset:-2px}
.wrap{max-width:1080px; margin:0 auto; padding:20px 16px 60px}

/* ── シリーズ切り替えナビ（全体｜ポケモン｜…） ── */
.pagenav{max-width:1080px; margin:0 auto; padding:0 16px 10px; display:flex;
  flex-wrap:wrap; gap:2px; font-size:12.5px; color:var(--muted)}
.pagenav a{color:var(--muted)}
.pagenav a.on{color:var(--accent); font-weight:800}
.pagenav a:hover{text-decoration:underline}
.pagenav .sep{margin:0 5px; color:var(--line)}

/* ── カテゴリ絞り込みタブ（全ページ・全レイアウト共通） ── */
.cattabs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px}

/* ── フィルターバー（期間・キャラクター・キーワード検索・絞り込みサマリー。
   全ページ・全レイアウト共通。cattabsの下、案A/B/Cの上に1つだけ表示する） ── */
.filterbar{background:var(--surface); border:1px solid var(--line); border-radius:8px;
  padding:12px 14px; margin-bottom:16px; display:flex; flex-direction:column; gap:10px}
.fb-row{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.fb-label{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); font-weight:600}
.fb-dates input[type=date]{appearance:none; font-family:inherit; font-size:13px; padding:5px 8px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface); color:var(--ink)}
.fb-tilde{color:var(--muted)}
.fb-shortcuts{display:flex; flex-wrap:wrap; gap:6px; margin-left:auto}
.fb-shortcuts button{appearance:none; font-family:inherit; cursor:pointer; font-size:12px;
  font-weight:600; padding:5px 10px; border-radius:999px; border:1px solid var(--line);
  background:var(--tint); color:var(--ink)}
.fb-shortcuts button:hover{background:var(--line)}
.fb-series{display:flex; flex-wrap:wrap; gap:6px; overflow-x:auto; padding-bottom:2px}
.fb-chip{appearance:none; font-family:inherit; cursor:pointer; font-size:12px; font-weight:600;
  padding:5px 11px; border-radius:999px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink); white-space:nowrap}
.fb-chip.on{background:var(--amber); border-color:var(--amber); color:#fff}
.fb-search input[type=text]{width:100%; font-family:inherit; font-size:13px; padding:7px 10px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface); color:var(--ink)}
.fb-summary{font-size:12.5px; color:var(--muted); display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.fb-summary .fb-count{font-weight:800; color:var(--ink)}
.fb-conds{color:var(--muted)}
.fb-reset{appearance:none; font-family:inherit; cursor:pointer; font-size:12px; font-weight:700;
  padding:4px 12px; border-radius:999px; border:1px solid var(--accent); background:var(--surface);
  color:var(--accent)}
.fb-reset:hover{background:var(--accent); color:#fff}
.fb-shortcuts button:focus-visible, .fb-chip:focus-visible, .fb-reset:focus-visible{
  outline:2px solid var(--indigo); outline-offset:2px}
@media(max-width:560px){
  .fb-dates{width:100%}
  .fb-shortcuts{margin-left:0; width:100%}
}

/* ── 日付ジャンプ目次（案B・案C。折りたたみ式・横スクロールのチップ列） ── */
.datejump{margin-bottom:14px; border:1px solid var(--line); border-radius:8px; background:var(--surface)}
.datejump summary{cursor:pointer; padding:8px 12px; font-size:12.5px; font-weight:700; color:var(--ink);
  list-style:none; display:flex; align-items:center; gap:4px}
.datejump summary::-webkit-details-marker{display:none}
.datejump summary::before{content:"▸"; color:var(--muted); font-size:11px; transition:transform .12s ease}
.datejump[open] summary::before{transform:rotate(90deg)}
.datejump-list{display:flex; gap:6px; overflow-x:auto; padding:0 12px 10px; scrollbar-width:thin}
.datejump-btn{appearance:none; font-family:inherit; cursor:pointer; font-size:11.5px; font-weight:600;
  padding:5px 10px; border-radius:6px; border:1px solid var(--line); background:var(--tint);
  color:var(--ink); white-space:nowrap; flex:0 0 auto}
.datejump-btn:hover{background:var(--line)}
.datejump-btn:focus-visible{outline:2px solid var(--indigo); outline-offset:2px}

/* ── バッジ ── */
.chip{display:inline-block; padding:1px 7px; border-radius:3px; font-size:11px;
  font-weight:700; line-height:1.7; white-space:nowrap}
.chip.soon{background:var(--accent); color:#fff}
.chip.today-chip{background:var(--accent); color:#fff}
.chip.rel{color:var(--green); border:1px solid currentColor}
.chip.pre{color:var(--indigo); border:1px solid currentColor}
.chip.lot{color:var(--purple); border:1px solid currentColor}
.chip.new{color:var(--indigo); border:1px solid currentColor}
.chip.cat{color:var(--muted); border:1px solid var(--line); font-weight:600}
.chip.series{color:var(--amber); border:1px solid currentColor; font-weight:600}
.chip.plat{color:var(--indigo); border:1px solid currentColor; font-weight:600}
.chip.sport{color:var(--indigo); border:1px solid currentColor; font-weight:600}
.chip.date-chip{color:var(--muted); border:1px solid var(--line); font-weight:600}
.chip.resale{color:var(--accent); border:1px solid currentColor; font-weight:600}

/* ── 外部サイト検索リンク（メルカリ｜Amazon｜楽天） ── */
/* white-space:normal（折り返し可）。nowrapだと小さいカード幅では横にはみ出すため */
.srch{display:block; margin-top:6px; font-size:11px; color:var(--muted); white-space:normal}
.srch a{color:var(--indigo); font-weight:700}
.srch a:hover{text-decoration:underline}
.srch .sep{margin:0 4px; color:var(--line)}

/* ── 商品ごとの抽選・予約受付ページ（src/lottery_research.py がリサーチ・照合）＋
   🔍 Google検索（全商品共通）。verified=falseのリンクは実機で別商品ページに
   飛ぶ誤りが確認されたため表示しない（stateには残すが表示側でのみ除外） ── */
.lotlinks{display:block; margin-top:4px; font-size:11px; color:var(--muted); white-space:normal}
.lotlinks .lbl{font-weight:800; color:var(--ink); margin-right:4px}
.lotlinks a{color:var(--accent); font-weight:700}
.lotlinks a:hover{text-decoration:underline}
.lotlinks a.glink{color:var(--muted); font-weight:600}
.lotlinks .sep{margin:0 4px; color:var(--line)}

/* ── 手動登録の予約リンク（config/manual_links.json。毎朝の自動収集(state更新)
   では上書きされないconfig側の手動データ。一致した商品にのみ表示） ── */
.manuallinks{display:block; margin-top:4px; font-size:11px; color:var(--muted); white-space:normal}
.manuallinks .lbl{font-weight:800; color:var(--ink); margin-right:4px}
.manuallinks a{color:var(--purple); font-weight:700}
.manuallinks a:hover{text-decoration:underline}
.manuallinks .mnote{color:var(--muted); font-weight:400; margin-left:2px}
.manuallinks .sep{margin:0 4px; color:var(--line)}

/* ── 画像 ── */
.ph{display:flex; align-items:center; justify-content:center; background:var(--tint);
  color:var(--muted); font-weight:700; text-align:center; padding:8px; font-size:12px}
.thumb{background:var(--tint); display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative}
.thumb img{width:100%; height:100%; object-fit:contain}
/* サムネイル画像を商品ページへのリンクにするラッパー。display:contents で
   自身は箱を生成せず、中身のthumbがそのままgrid/flexの直接の子として扱われる
   （hero/card/fcard/flist 各所の既存レイアウト計算に影響を与えないための工夫） */
.tlink{display:contents}

/* ════ 案A ポータル ════ */
.pA .layout{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:20px}
@media(max-width:820px){.pA .layout{grid-template-columns:1fr}}
.box{background:var(--surface); border:1px solid var(--line); border-radius:6px; overflow:hidden}
.box-h{display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line);
  font-size:15px; font-weight:800}
.box-h .tag{font-size:11px; color:#fff; background:var(--accent); border-radius:3px; padding:1px 7px}
.hero{display:grid; grid-template-columns:170px minmax(0,1fr); gap:14px; padding:14px; cursor:pointer}
@media(max-width:480px){.hero{grid-template-columns:110px minmax(0,1fr)}}
.hero .thumb{aspect-ratio:1/1; border-radius:4px}
.hero .hl{font-size:17px; font-weight:800; line-height:1.4; margin:2px 0 8px; text-wrap:balance}
.hero .meta{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:12px; color:var(--muted)}
.headline{list-style:none; margin:0; padding:4px 14px 10px}
.headline li{padding:7px 0; border-top:1px solid var(--line); display:flex; gap:8px; align-items:baseline}
.headline li:first-child{border-top:0}
.headline .dot{color:var(--accent); font-weight:800}
.headline .d{margin-left:auto; color:var(--muted); font-size:11.5px; white-space:nowrap}
.hrow{display:flex; gap:10px; overflow-x:auto; padding:14px; scrollbar-width:thin}
.hcard{flex:0 0 128px; min-width:0}
.hcard .thumb{width:128px; height:128px; border-radius:4px}
.hcard .t{font-size:12px; font-weight:600; line-height:1.35; margin-top:6px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.hcard .d{font-size:11px; color:var(--muted); margin-top:2px}
.dense{list-style:none; margin:0; padding:0}
.dense li{display:flex; gap:10px; padding:10px 14px; border-top:1px solid var(--line); align-items:center; cursor:pointer}
.dense .thumb{flex:0 0 52px; width:52px; height:52px; border-radius:4px}
.dense .t{font-size:13px; font-weight:600; line-height:1.4;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.dense .sub{font-size:11.5px; color:var(--muted); margin-top:1px}
.rail .box{margin-bottom:16px}
.cal{padding:6px 14px 12px}
.cal-d{font-size:12px; font-weight:800; color:var(--accent); margin:10px 0 4px}
.cal-i{font-size:12.5px; padding:3px 0 3px 10px; border-left:2px solid var(--line); margin-left:2px}
.stats{display:flex; gap:0; text-align:center; padding:12px 8px}
.stats div{flex:1}
.stats .n{font-size:22px; font-weight:800}
.stats .l{font-size:11px; color:var(--muted)}
.lotlist{list-style:none; margin:0; padding:6px 14px 12px}
.lotlist li{padding:5px 0; border-top:1px solid var(--line); font-size:12.5px}
.lotlist li:first-child{border-top:0}
.lotlist a{color:var(--indigo); font-weight:600}
.lotlist a:hover{text-decoration:underline}

/* ── 日付グループ見出し（案B・案C 共通。折りたたみ可能なボタン。
   2026-08-08追加: 開閉トグル。デフォルト状態は日付グループ・日付未定=展開／
   月グループ(「◯年◯月発売予定」)は今月より前のみ折りたたみ・今月以降は展開
   （2026-08-09変更。JS側isSectionCollapsed()/defaultCollapsedForKind()参照。
   過去月の巨大まとめは畳んで縦長化を防ぎつつ、未来月しか無い予約商品が
   開いた瞬間から見えるようにする）。タップ領域はモバイル390px幅でも44px
   以上を確保するためmin-height:44pxを明示する（見た目のpaddingだけに
   頼らない） ── */
.dsec{appearance:none; font-family:inherit; font-size:inherit; border:0; background:none;
  padding:0; text-align:left; color:inherit; cursor:pointer; width:100%; min-height:44px;
  box-sizing:border-box; margin:22px 0 10px; display:flex; align-items:center; gap:10px}
.dsec:first-child{margin-top:0}
.dsec:hover{background:var(--tint)}
.dsec:focus-visible{outline:2px solid var(--indigo); outline-offset:2px}
.dsec .dsec-toggle{flex:0 0 auto; font-size:11px; color:var(--muted); display:inline-block;
  transition:transform .12s ease}
.dsec[aria-expanded="true"] .dsec-toggle{transform:rotate(90deg)}
.dsec .name{font-size:14px; font-weight:800; white-space:nowrap}
.dsec .rule{height:1px; background:var(--line); flex:1}
.dsec .cnt{font-size:12px; color:var(--muted); white-space:nowrap}
/* 折りたたみ対象の商品群のラッパー。display:contentsで自身は箱を作らず、
   中身（.card/.frow）をそのまま親（.grid/.flist）の直接の子として扱わせる
   ことで、CSS Gridのカラム計算・flistの罫線ロジックに影響を与えない
   （既存の :first-child セレクタは見出し(.dsec)自体が常に非ラップのため
   影響を受けない。詳細はlogs/build-report-20260808-collapse.md参照）。
   .collapsed時のみdisplay:noneで丸ごと非表示にする（子のimg[data-src]も
   非レンダリングになりIntersectionObserverが自動的にisIntersecting:false
   を返す＝遅延読み込みが走らない。展開時にtoggleSection/jumpToSectionが
   observeLazyImages()を呼び直すことで読み込みを保証する） */
.dsec-items{display:contents}
.dsec-items.collapsed{display:none}

/* ════ 案B ストア ════ */
.pB .filters{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px}
.pB .filters button, .cattabs button{appearance:none; font-family:inherit; cursor:pointer; font-size:13px;
  font-weight:600; padding:6px 14px; border-radius:999px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink)}
.pB .filters button.on, .cattabs button.on{background:var(--indigo); border-color:var(--indigo); color:#fff}
.pB .filters button:focus-visible, .cattabs button:focus-visible{outline:2px solid var(--indigo); outline-offset:2px}
.pB .filters .grouptoggle{margin-left:auto}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(185px,1fr)); gap:14px}
.grid .dsec{grid-column:1/-1}
.card{background:var(--surface); border:1px solid var(--line); border-radius:8px; overflow:hidden;
  display:flex; flex-direction:column; transition:transform .12s ease, box-shadow .12s ease; cursor:pointer}
@media(prefers-reduced-motion:no-preference){
  .card:hover{transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.10)}
}
.card .imgbox{position:relative; aspect-ratio:1/1}
.card .thumb{width:100%; height:100%}
.card .ph{width:100%; height:100%}
.card .bdg{position:absolute; top:8px; left:8px; display:flex; flex-direction:column; gap:4px; align-items:flex-start}
.card .body{padding:10px 12px 12px; display:flex; flex-direction:column; gap:4px; flex:1}
.card .t{font-size:13px; font-weight:700; line-height:1.4;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.card .mk{font-size:11.5px; color:var(--muted)}
.card .foot{margin-top:auto; display:flex; justify-content:space-between; align-items:baseline; padding-top:6px}
.card .dt{font-size:12px; color:var(--muted)}
.card .pr{font-size:14px; font-weight:800}

/* ════ 案C 朝刊 ════ 2026-08-10改修: 新聞紙面風に作り替え（asakan-*）。
   見出し等の明朝フォントは新規CSS変数を増やさず直接指定（テーマ色トークン
   var(--ink)/var(--accent)/var(--indigo)/var(--line)/var(--muted)/var(--surface)/
   var(--tint)は既存のライト/ダーク定義をそのまま流用し、朝刊専用の新しい
   色トークンは追加しない＝既存のテーマ切替と自動的に整合する）。
   紙面一覧（.flist/.frow、下記）は従来のCSSをそのまま流用する。 */
.pC{max-width:560px; margin:0 auto}
.asakan-serif{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}

/* ── 題字部: 横書き題字＋朱印＋発行日＋二重罫線（2026-08-10改修）──
   当初は縦方向に文字を積む題字だったが、実機スクリーンショットで
   縦約300px・右側ほぼ空白というユーザー指摘を受け、横書き1行のコンパクトな
   段（目安60〜80px）に変更した。左に題字＋朱印、右に発行日＋更新時刻を
   横並びにし、幅が足りないモバイルではmasthead-rowのflex-wrapで題字行→
   日付行の2段に自然に折り返す（崩れない）。 */
.asakan-masthead{padding:4px 0 12px}
.asakan-masthead-row{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:6px 16px}
.asakan-title-block{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.asakan-vtitle{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  font-weight:900; font-size:22px; letter-spacing:.04em; color:var(--ink); line-height:1.3}
.asakan-hanko{display:inline-block; background:var(--accent); color:#fff;
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif; font-weight:700;
  font-size:12.5px; padding:.3em .6em; border-radius:2px; letter-spacing:.1em; line-height:1}
.asakan-issue-info{text-align:right}
.asakan-issue-date{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  font-weight:700; font-size:14px; margin:0; line-height:1.3}
.asakan-issue-note{font-size:11px; color:var(--muted); margin:0; line-height:1.3}
.asakan-rule-double{margin-top:8px; border-top:3px solid var(--ink)}
.asakan-rule-double::after{content:""; display:block; border-top:1px solid var(--ink); margin-top:3px}

/* ── サマリー行 ── */
.asakan-summary{margin:12px 0 0; padding:8px 0; border-top:1px solid var(--line);
  border-bottom:1px solid var(--line); font-size:13px}
.asakan-summary strong{color:var(--accent); font-size:1.15em}

/* ── 本日のピックアップ商品（トップ1件＋準トップ4件） ──
   画像は元解像度以上に引き伸ばさない: width:auto/height:auto＋max-widthで
   自然サイズを尊重する（トップも表示幅は最大360px、準トップは160pxに抑え、
   「一面らしさ」は見出しの文字サイズ・太さで出す）。読み込み前のレイアウト
   崩れを抑えるためmin-heightのみ最小限のプレースホルダー高さを与える。 */
.asakan-topblock{margin-top:18px}
.asakan-badge-new{display:inline-block; background:var(--accent); color:#fff; font-size:11px;
  font-weight:700; padding:.2em .6em; letter-spacing:.05em; margin-bottom:6px}
.asakan-badge-new.small{font-size:10px; padding:.15em .5em; position:absolute; top:10px; left:0; z-index:1}
.asakan-top{border-bottom:1px solid var(--line); padding-bottom:18px; margin-bottom:18px; cursor:pointer}
.asakan-top .thumb.asakan-top-img{width:auto; max-width:360px; height:auto; max-height:280px; min-height:120px;
  aspect-ratio:auto; background:none; margin:8px 0 10px}
.asakan-top .thumb.asakan-top-img img{width:auto; height:auto; max-width:360px; max-height:280px; object-fit:contain}
.asakan-top .ph.asakan-top-img{width:100%; max-width:360px; aspect-ratio:16/10; margin:8px 0 10px}
.asakan-top-title{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  font-weight:900; font-size:21px; line-height:1.4; text-wrap:balance; margin:0 0 8px}
.asakan-top-title a{color:var(--ink)}
.asakan-lead{font-size:13.5px; color:var(--ink); margin:0 0 8px}
.asakan-substories{display:grid; grid-template-columns:repeat(2,1fr); gap:16px}
@media(min-width:640px){.asakan-substories{grid-template-columns:repeat(4,1fr)}}
.asakan-sub{position:relative; border-top:1px solid var(--line); padding-top:10px; cursor:pointer}
.asakan-sub .thumb.asakan-sub-img{width:auto; max-width:160px; height:auto; max-height:120px; min-height:60px;
  aspect-ratio:auto; background:none; margin:0 0 8px}
.asakan-sub .thumb.asakan-sub-img img{width:auto; height:auto; max-width:160px; max-height:120px; object-fit:contain}
.asakan-sub .ph.asakan-sub-img{width:100%; max-width:160px; aspect-ratio:4/3; margin:0 0 8px}
.asakan-sub-title{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  font-weight:700; font-size:13.5px; line-height:1.45; text-wrap:balance; margin:0 0 4px}
.asakan-sub-title a{color:var(--ink)}
.asakan-sub-meta{font-size:11px; color:var(--muted); margin:0}

/* ── セクション見出し共通（本日のピックアップニュース／締切間近／カテゴリ面／紙面一覧） ── */
.asakan-section-title{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  font-weight:700; font-size:16px; border-bottom:2px solid var(--ink); padding-bottom:6px;
  margin:26px 0 10px; display:flex; align-items:baseline; gap:8px}
.asakan-shimen-cnt{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  font-weight:400; font-size:12px; color:var(--muted); margin-left:auto}

/* ── 本日のピックアップニュース ── */
.asakan-news-list{list-style:none; margin:0; padding:0}
.asakan-news-item{display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; padding:9px 0;
  border-bottom:1px solid var(--line); font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif; font-size:14.5px}
.asakan-news-tag{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  font-size:10.5px; font-weight:700; color:var(--indigo); border:1px solid var(--indigo);
  padding:.15em .5em; border-radius:2px; flex-shrink:0}
.asakan-news-item a{color:var(--ink); flex:1 1 auto; min-width:0}
.asakan-news-maker{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  font-size:10.5px; color:var(--muted); width:100%}
@media(min-width:640px){.asakan-news-maker{width:auto; margin-left:auto}}

/* ── 締切間近（2026-08-10改修: 期限グループ表示。朱色見出し・罫線の
   トーンは既存のまま、内側に「7日以内」「2週間以内（8〜14日）」の
   小見出し付きリストを追加し、末尾に「15日以降」の件数のみの誘導行を置く） ── */
.asakan-lottery{border:2px solid var(--accent); padding:14px 16px 16px; margin-top:24px}
.asakan-lottery-title{color:var(--accent); border-bottom-color:var(--accent); margin-top:0}
.asakan-lottery-group{margin-top:12px}
.asakan-lottery-group:first-of-type{margin-top:6px}
.asakan-lottery-group-title{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  font-weight:700; font-size:13px; color:var(--accent); margin:0 0 4px;
  display:flex; align-items:baseline; gap:6px}
.asakan-lottery-group-count{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  font-weight:400; font-size:11px; color:var(--muted)}
.asakan-lottery-list{list-style:none; margin:0; padding:0}
.asakan-lottery-item{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 10px; padding:8px 0;
  border-bottom:1px dashed var(--line)}
.asakan-lottery-item:last-child{border-bottom:none}
.asakan-deadline{font-weight:900; color:var(--accent); font-size:12.5px; flex-shrink:0}
.asakan-lottery-item a{color:var(--ink); font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
.asakan-lottery-shop{font-size:11px; color:var(--muted); width:100%}
@media(min-width:640px){.asakan-lottery-shop{width:auto; margin-left:auto}}
.asakan-lottery-more{margin:12px 0 0; padding-top:10px; border-top:1px dashed var(--line); font-size:12px}
.asakan-lottery-more a{color:var(--indigo); font-weight:700}
.asakan-lottery-more a:hover{text-decoration:underline}

/* ── カテゴリ面（そのページのcattabs軸のタブごとに3件程度＋誘導リンク） ── */
.asakan-catfaces{display:grid; grid-template-columns:1fr; gap:20px 28px; margin-top:24px}
@media(min-width:640px){.asakan-catfaces{grid-template-columns:repeat(2,1fr)}}
.asakan-catface-title{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  font-weight:700; font-size:14.5px; border-bottom:1px solid var(--ink); padding-bottom:5px; margin:0 0 6px}
.asakan-catface-list{list-style:none; margin:0 0 6px; padding:0}
.asakan-catface-list li{padding:6px 0; border-bottom:1px solid var(--line); display:flex;
  justify-content:space-between; gap:10px; font-size:12.5px}
.asakan-catface-list a{color:var(--ink); min-width:0}
.asakan-catface-meta{color:var(--muted); font-size:11px; flex-shrink:0; white-space:nowrap}
.asakan-more{appearance:none; font-family:inherit; border:0; background:none; padding:0; cursor:pointer;
  font-size:11.5px; font-weight:700; color:var(--indigo)}
.asakan-more:hover{text-decoration:underline}
.asakan-more:focus-visible{outline:2px solid var(--indigo); outline-offset:2px}

/* ── 紙面一覧（従来の日付グループ一覧。.flist/.frow は既存CSSをそのまま流用） ── */
.asakan-shimen-title{margin-top:26px}
.flist{background:var(--surface); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.flist .frow{display:flex; gap:12px; padding:11px 14px; border-top:1px solid var(--line); align-items:center; cursor:pointer}
.flist .frow:first-child{border-top:0}
.flist .dsec{margin:0; padding:10px 14px 4px; border-top:1px solid var(--line)}
.flist .dsec:first-child{border-top:0; padding-top:12px}
.flist .thumb{flex:0 0 56px; width:56px; height:56px; border-radius:6px}
.flist .t{font-size:13.5px; font-weight:700; line-height:1.4;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.flist .sub{font-size:11.5px; color:var(--muted); margin-top:2px}

/* ── 抽選・予約サイト（案B/案C 末尾のコンパクトリンク集） ── */
.lotcompact{margin-top:24px; padding-top:14px; border-top:1px solid var(--line);
  font-size:12px; color:var(--muted); display:flex; flex-wrap:wrap; align-items:center; gap:2px}
.lotcompact .ttl{font-weight:800; color:var(--ink); margin-right:6px}
.lotcompact a{color:var(--indigo); font-weight:600}
.lotcompact a:hover{text-decoration:underline}
.lotcompact .sep{margin:0 4px; color:var(--line)}

.foot-note{margin-top:36px; text-align:center; color:var(--muted); font-size:12px}

/* ── 商品詳細モーダル（カード/行クリックで開く。1個をJSで使い回す） ── */
.modal-overlay{position:fixed; inset:0; background:rgba(20,22,28,.55); z-index:1000;
  display:flex; align-items:flex-end; justify-content:center; padding:0}
.modal-overlay[hidden]{display:none}
@media(min-width:640px){
  .modal-overlay{align-items:center; padding:20px}
}
.modal-sheet{background:var(--surface); color:var(--ink); width:100%; max-width:560px;
  max-height:90vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  border-radius:16px 16px 0 0; position:relative; padding:22px 18px 24px}
@media(min-width:640px){
  .modal-sheet{border-radius:12px}
}
@media(prefers-reduced-motion:no-preference){
  .modal-sheet{animation:modal-in .18s ease-out}
}
@keyframes modal-in{from{transform:translateY(18px); opacity:0} to{transform:translateY(0); opacity:1}}
.modal-close{position:absolute; top:10px; right:10px; width:34px; height:34px; border-radius:50%;
  border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:18px;
  line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
  font-family:inherit}
.modal-close:hover{background:var(--tint)}
.modal-close:focus-visible{outline:2px solid var(--indigo); outline-offset:2px}
.modal-thumb{aspect-ratio:1/1; max-height:300px; border-radius:8px; margin-bottom:14px; overflow:hidden}
.modal-thumb .thumb{width:100%; height:100%}
.modal-title{font-size:18px; font-weight:800; line-height:1.4; margin:0 0 10px; padding-right:32px}
.modal-chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px}
.modal-details{border-top:1px solid var(--line); padding-top:10px; margin-bottom:16px}
.modal-row{display:flex; gap:10px; padding:5px 0; font-size:13px}
.modal-row .modal-label{flex:0 0 84px; color:var(--muted); font-weight:600}
.modal-row .modal-value{flex:1; min-width:0; word-break:break-word}
.modal-links{display:flex; flex-wrap:wrap; gap:8px}
.modal-link{font-size:12.5px; font-weight:700; padding:7px 12px; border-radius:6px;
  border:1px solid var(--line); color:var(--indigo); background:var(--surface)}
.modal-link:hover{background:var(--tint)}
.modal-link:focus-visible{outline:2px solid var(--indigo); outline-offset:2px}
.modal-link.primary{background:var(--indigo); color:#fff; border-color:var(--indigo)}
.modal-link.accent{color:var(--accent); border-color:var(--accent)}
.modal-link.manual{color:var(--purple); border-color:var(--purple)}
.modal-link.muted{color:var(--muted)}
.modal-link-wrap{display:inline-flex; align-items:center; gap:4px}
.modal-link-note{font-size:11px; color:var(--muted)}

/* ── トップへ戻るボタン（右下固定。1画面分下スクロールしたら表示、
   最上部付近では非表示。全ページ・全レイアウト共通。
   モーダル(z-index:1000)より低いz-indexにして、モーダル表示中は
   オーバーレイの下に隠れる＝追加のJS制御なしで自然に共存する） ── */
.back-to-top{position:fixed; right:16px;
  bottom:calc(16px + env(safe-area-inset-bottom, 0px)); width:48px; height:48px;
  border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  font-size:20px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
  font-family:inherit; box-shadow:0 4px 14px rgba(0,0,0,.18); z-index:900;
  opacity:0; visibility:hidden; transform:translateY(8px);
  transition:opacity .18s ease, transform .18s ease, visibility .18s step-end}
.back-to-top.show{opacity:1; visibility:visible; transform:translateY(0);
  transition:opacity .18s ease, transform .18s ease, visibility .18s step-start}
.back-to-top:hover{background:var(--tint)}
.back-to-top:focus-visible{outline:2px solid var(--indigo); outline-offset:2px}
@media(prefers-reduced-motion:reduce){.back-to-top{transition:opacity .01s}}
</style>
</head>

  return list.filter(i => {const d = days(i); return d !== null && d >= 0 && d <= 14;})

  return list.filter(i => {const ds = daysSince(i.first_seen); return ds !== null && ds >= 0 && ds <= 3;})

             .slice(0, 20);

/* ── 期間・キャラクター・キーワード絞り込み（全ページ・全レイアウト共通） ──
   3条件はAND。cattabs（baseData）の結果にさらに掛け合わせる。
   案A/B/CいずれもこのcurrentData()を起点にリストを組み立てるため、
   3レイアウトすべてに自動的に同じ絞り込みが効く。 */
let dateFrom = ""; // "YYYY-MM-DD" or ""
let dateTo = "";   // "YYYY-MM-DD" or ""
let seriesFilter = new Set(); // 選択中のシリーズ名（OR条件）
let makerFilter = new Set(); // 選択中のメーカーグループ名（OR条件、seriesFilterと対）
let searchQuery = "";
let resaleFilter = "all"; // "all"|"hide"|"only"。it.resale（Python側_is_resale_item判定）に対する絞り込み
function monthRange(ym){
  const m = /^(\d{4})-(\d{2})$/.exec(ym || "");
  if(!m) return null;
  const y = +m[1], mo = +m[2];
  return [new Date(y, mo - 1, 1), new Date(y, mo, 0)]; // その月の1日〜末日
}
function inDateRange(it){
  const hasFrom = !!dateFrom, hasTo = !!dateTo;
  if(!hasFrom && !hasTo) return true; // 期間未指定なら従来どおり全件通す（未定含む）
  const fromD = hasFrom ? parseDate(dateFrom) : null;
  const toD = hasTo ? parseDate(dateTo) : null;
  const v = dateField(it); // lottery.htmlではlottery_deadline基準（dateField参照）
  if(isFullDate(v)){
    const d = parseDate(v);
    if(!d) return false;
    if(fromD && d < fromD) return false;
    if(toD && d > toD) return false;
    return true;
  }
  if(isMonthOnly(v)){
    // 月精度は「その月が指定範囲と1日でも重なれば表示」＝月の1日〜末日の
    // レンジと指定期間のレンジが重なるかどうかで判定する。
    const range = monthRange(v);
    if(!range) return false;
    const mStart = range[0], mEnd = range[1];
    if(fromD && mEnd < fromD) return false;
    if(toD && mStart > toD) return false;
    return true;
  }
  // 発売日「未定」/空/パース不能: 期間指定が有効な間は非表示
  return false;
}
function matchesSeriesFilter(it){
  if(seriesFilter.size === 0) return true;
  const labels = it.series || [];
  for(let k = 0; k < labels.length; k++){ if(seriesFilter.has(labels[k])) return true; }
  return false;
}
function matchesMakerFilter(it){
  // it.maker_groups は Python側(_maker_group_labels_for_item)がconfig/
  // maker_groups.jsonの定義で判定済みの結果（matchesSeriesFilterと同じ形。
  // maker欄が空の商品はmaker_groupsも空配列なので、チップ選択時は非表示になる）。
  if(makerFilter.size === 0) return true;
  const labels = it.maker_groups || [];
  for(let k = 0; k < labels.length; k++){ if(makerFilter.has(labels[k])) return true; }
  return false;
}
function matchesSearch(it){
  const q = (searchQuery || "").trim();
  if(!q) return true;
  const terms = q.split(/\s+/).filter(Boolean).map(t => t.toLowerCase());
  if(!terms.length) return true;
  const hay = [it.title || "", it.maker || ""].concat(it.series || []).join(" ").toLowerCase();
  return terms.every(t => hay.indexOf(t) !== -1);
}
function matchesResaleFilter(it){
  if(resaleFilter === "hide") return !it.resale;
  if(resaleFilter === "only") return !!it.resale;
  return true;
}
function applyExtraFilters(list){
  return list.filter(it => inDateRange(it) && matchesSeriesFilter(it) && matchesMakerFilter(it) && matchesSearch(it) && matchesResaleFilter(it));
}
function currentData(){
  return applyExtraFilters(baseData());
}
function extraFilterStorageKey(){
  // PAGE_ID単位（ページ実体単位）でキーを分ける。PAGE_MODEは複数の実ページ
  // （例: pokemon.html/onepiece.html は両方"default"）で共有されるため使わない。
  return "rw_filters_" + PAGE_ID;
}
function saveExtraFilters(){
  try{
    localStorage.setItem(extraFilterStorageKey(), JSON.stringify({
      from: dateFrom, to: dateTo, series: Array.from(seriesFilter),
      makers: Array.from(makerFilter), q: searchQuery, resale: resaleFilter,
    }));
  }catch(e){}
}
function loadExtraFilters(){
  try{
    const raw = localStorage.getItem(extraFilterStorageKey());
    if(!raw) return;
    const obj = JSON.parse(raw);
    if(typeof obj.from === "string") dateFrom = obj.from;
    if(typeof obj.to === "string") dateTo = obj.to;
    if(Array.isArray(obj.series)) seriesFilter = new Set(obj.series.filter(s => typeof s === "string"));
    if(Array.isArray(obj.makers)) makerFilter = new Set(obj.makers.filter(s => typeof s === "string"));
    if(typeof obj.q === "string") searchQuery = obj.q;
    if(obj.resale === "hide" || obj.resale === "only" || obj.resale === "all") resaleFilter = obj.resale;
  }catch(e){}
}
function fmtISO(d){
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function applyDateShortcut(kind){
  if(kind === "clear"){
    dateFrom = ""; dateTo = "";
  } else if(kind === "week"){
    const day = TODAY.getDay(); // 0=日曜
    const mondayOffset = day === 0 ? -6 : 1 - day;
    const monday = new Date(TODAY); monday.setDate(TODAY.getDate() + mondayOffset);
    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    dateFrom = fmtISO(monday); dateTo = fmtISO(sunday);
  } else if(kind === "month"){
    const first = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
    const last = new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, 0);
    dateFrom = fmtISO(first); dateTo = fmtISO(last);
  } else if(kind === "14d"){
    const end = new Date(TODAY); end.setDate(TODAY.getDate() + 14);
    dateFrom = fmtISO(TODAY); dateTo = fmtISO(end);
  }
  const fromEl = document.getElementById("fbFrom");
  const toEl = document.getElementById("fbTo");
  if(fromEl) fromEl.value = dateFrom;
  if(toEl) toEl.value = dateTo;
  saveExtraFilters();
  renderAll();
}
function onDateInputChange(){
  const fromEl = document.getElementById("fbFrom");
  const toEl = document.getElementById("fbTo");
  dateFrom = fromEl ? fromEl.value : "";
  dateTo = toEl ? toEl.value : "";
  saveExtraFilters();
  renderAll();
}
function toggleSeriesFilter(name, btn){
  if(seriesFilter.has(name)) seriesFilter.delete(name);
  else seriesFilter.add(name);
  if(btn) btn.classList.toggle("on", seriesFilter.has(name));
  saveExtraFilters();
  renderAll();
}
function toggleMakerFilter(name, btn){
  if(makerFilter.has(name)) makerFilter.delete(name);
  else makerFilter.add(name);
  if(btn) btn.classList.toggle("on", makerFilter.has(name));
  saveExtraFilters();
  renderAll();
}
function setResaleFilter(value, btn){
  // 3値の排他トグル（すべて/隠す/のみ）。seriesFilter/makerFilterのOR集合と
  // 違い単一値のため、選択ボタンの兄弟だけ"on"を付け替える。
  resaleFilter = value;
  if(btn && btn.parentElement){
    Array.from(btn.parentElement.querySelectorAll(".fb-chip")).forEach(b => {
      b.classList.toggle("on", b === btn);
    });
  }
  saveExtraFilters();
  renderAll();
}
let searchDebounceTimer = null;
function onSearchInput(){
  const el = document.getElementById("fbSearch");
  const val = el ? el.value : "";
  if(searchDebounceTimer) clearTimeout(searchDebounceTimer);

    searchQuery = val;
    saveExtraFilters();
    renderAll();
  }, 150);
}
function resetAllFilters(){

function activeFilterDescriptions(){

  }

  if(makerFilter.size){
    parts.push(`メーカー: ${Array.from(makerFilter).map(esc).join("・")}`);

  if(searchQuery.trim()){
    parts.push(`検索: 「${esc(searchQuery.trim())}」`);

  if(resaleFilter === "hide"){
    parts.push("再販: 隠す");

    parts.push("再販: のみ表示");
  }
  return parts;
}
function updateFilterSummary(){

/* ── 日付グループ化（案B・案C 共通） ── */
const WD_JA = ["日","月","火","水","木","金","土"]; // Date.getDay() 0=日曜 起点
function isFullDate(s){
  return /^\d{4}-\d{2}-\d{2}$/.test(s || "");
}
// フィギュア系ソース（プレバン・グッスマ等）は発売日が「YYYY-MM」（月まで）
// までしか判明していない商品がある。フル日付("YYYY-MM-DD")と区別して
// 専用の月グループにまとめる（"未定"・空・パース不能な値はここに含めない＝
// 従来通り undated 行き。isFullDate/isMonthOnlyのどちらにも一致しない値だけが
// undated に残る）。
function isMonthOnly(s){
  return /^\d{4}-\d{2}$/.test(s || "");
}
function dateGroupLabel(dateStr){
  // 呼び出し側は isFullDate() で絞り込んだ "YYYY-MM-DD" のみを渡す前提
  const d = parseDate(dateStr);
  if(!d) return dateStr;
  return `${dateStr}（${WD_JA[d.getDay()]}）`;
}
function monthGroupLabel(ym){
  // 呼び出し側は isMonthOnly() で絞り込んだ "YYYY-MM" のみを渡す前提
  const m = /^(\d{4})-(\d{2})$/.exec(ym);
  if(!m) return ym;
  return `${+m[1]}年${+m[2]}月発売予定`;
}
function groupItemsByDate(list){
  // フル日付("YYYY-MM-DD")は日付ごとに、月のみ判明("YYYY-MM")は月ごとに束ねる。
  // それ以外("未定"/空/パース不能)は「日付未定」グループへ最後にまとめる
  // （"未定"の扱いは従来通り変更しない）。
  const groups = {};
  const monthGroups = {};
  const undated = [];
  list.forEach(i => {
    const v = dateField(i); // lottery.htmlではlottery_deadline基準（dateField参照）
    if(isFullDate(v)) (groups[v] = groups[v] || []).push(i);
    else if(isMonthOnly(v)) (monthGroups[v] = monthGroups[v] || []).push(i);
    else undated.push(i);
  });
  // 日付グループと月グループを時系列で1本の並びにする。月グループの並び順は
  // 「その月の日付グループの末尾」に来るよう、ソートキーに疑似的な日として
  // "-99"（実在する最大の日"31"より大きく、翌月の"01"より確実に手前になる）を
  // 付与する。全キーが同じ桁数の数字文字列（YYYY-MM-DD/YYYY-MM-99）になるため
  // 文字列比較のままで時系列ソートとして成立する。
  const ordered = Object.keys(groups).map(d => ({ kind: "date", key: d, sortKey: d }))
    .concat(Object.keys(monthGroups).map(ym => ({ kind: "month", key: ym, sortKey: ym + "-99" })))
    .sort((a, b) => a.sortKey < b.sortKey ? -1 : a.sortKey > b.sortKey ? 1 : 0);
  return { ordered, groups, monthGroups, undated };
}
// ── 日付グループの開閉（折りたたみ）── 2026-08-08追加。
// 保存はしない（毎朝データが総入れ替えされるため、開閉状態を永続化する意味が
// 薄い。ページを開き直すたびデフォルト状態にリセットされる仕様。設計判断は
// logs/build-report-20260808-collapse.md参照）。ページ内ではsectionCollapse
// （個別トグルの明示的な上書き）とcollapseAllMode（「全て開く／全て折りたたむ」
// の一括モード）をJS変数として保持する。idは「idPrefix-日付orYYYY-MM」で
// 安定しているため、絞り込み変更でrenderGridB/renderCが再実行されても
// 同じグループには同じ開閉状態が再現され、破綻しない。
let sectionCollapse = {}; // id -> boolean（明示トグル済みのものだけ持つ）
let collapseAllMode = null; // null（種類別デフォルト）|"collapsed"|"expanded"
// 月グループの既定折りたたみ判定に使う「今月」は、ページ生成時刻
// （TODAY/TODAY_ISO、Python側で朝1回だけ焼き込まれる値）ではなく、
// この関数が呼ばれた時点＝閲覧時刻のブラウザ日時から都度計算する
// （生成は朝1回でも閲覧は1日中続くため。ebayResearchUrl()がDate.now()を
// 呼び出し時点で都度計算するのと同じ流儀。2026-08-09追加。
// logs/build-report-20260808-collapse.md「追加修正(2026-08-09)」参照）。
function currentYearMonth(){
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
}
function defaultCollapsedForKind(kind, key){
  // 既定: 日付グループ・日付未定=展開。月グループ（月精度しか分からない
  // フィギュア系商品の「◯年◯月発売予定」）は、今月より前の月のみ折りたたみ、
  // 今月以降（今月を含む）は展開する（2026-08-09変更）。過去月の巨大な
  // まとめ（例: 7月335件）は畳んで縦長化を防ぎつつ、未来月しか無い予約商品
  // （ダイワ148件・がまかつ24件等）は開いた瞬間から見える状態にする。
  if(kind !== "month") return false;
  return key < currentYearMonth();
}
function isSectionCollapsed(id, kind, key){
  if(Object.prototype.hasOwnProperty.call(sectionCollapse, id)) return sectionCollapse[id];
  if(collapseAllMode === "collapsed") return true;
  if(collapseAllMode === "expanded") return false;
  return defaultCollapsedForKind(kind, key);
}
function sectionHeaderHtml(id, label, count, kind, key){
  const collapsed = isSectionCollapsed(id, kind, key);
  return `<button type="button" class="dsec" id="${esc(id)}" aria-expanded="${collapsed ? "false" : "true"}" aria-controls="${esc(id)}-items" onclick="toggleSection('${esc(id)}')">`
    + `<span class="dsec-toggle" aria-hidden="true">▸</span>`
    + `<span class="name num">${esc(label)}</span>`
    + `<span class="rule"></span>`
    + `<span class="cnt num">${count}件</span>`
    + `</button>`;
}
function sectionItemsHtml(id, bucket, itemHtmlFn, kind, key){
  const collapsed = isSectionCollapsed(id, kind, key);
  return `<div class="dsec-items${collapsed ? " collapsed" : ""}" id="${esc(id)}-items">`
    + bucket.map(itemHtmlFn).join("")
    + `</div>`;
}
// 見出しボタンのクリックで呼ばれる。DOM操作のみ（class付け替え＋aria-expanded）で
// renderGridB/renderCの再実行はしない（軽量・確実。335件級の月グループでも
// 文字列再生成が発生しない）。展開時はobserveLazyImages()を呼び直し、
// 折りたたみ中は監視対象から外れていた（display:noneのため交差判定されない）
// 画像を確実に読み込ませる。
function toggleSection(id){
  const wrap = document.getElementById(id + "-items");
  const btn = document.getElementById(id);
  if(!wrap || !btn) return;
  const willCollapse = !wrap.classList.contains("collapsed");
  wrap.classList.toggle("collapsed", willCollapse);
  btn.setAttribute("aria-expanded", willCollapse ? "false" : "true");
  sectionCollapse[id] = willCollapse;
  observeLazyImages();
}
// 上部「全て開く／全て折りたたむ」ボタン（renderFilterBar参照）。個別トグルの
// 上書き(sectionCollapse)はクリアして一括モードに揃え、以後（次のフィルタ
// 変更で新しく現れるグループも含め）全グループに一律で適用する。表示中の
// 案B・案Cのみ再描画する（案Aは日付グループ表示を持たないため対象外。
// 案Aの構造確認・適用可否の判断はlogs/build-report-20260808-collapse.md参照）。
function setCollapseAllMode(mode){
  collapseAllMode = mode;
  sectionCollapse = {};
  renderGridB();
  renderC();
}
// groupItemsByDate()の戻り値(g)を1回だけ計算し、本文HTML（renderDateSectionsFromGroups）
// と日付ジャンプ目次（renderJumpNavFromGroups）の両方に渡すことで、同じ集計を
// 2回計算して結果がずれる事故を防ぐ（呼び出し側は必ずgを使い回すこと）。
// idPrefix: 案B("secB")／案C("secC")でアンカーIDの名前空間を分ける
// （案B・案Cは常に両方DOM上に存在し、hidden属性で表示切替するだけのため、
// 同じ日付キーでもidが衝突しないようにする必要がある）。
function renderDateSectionsFromGroups(g, itemHtmlFn, idPrefix){
  const { ordered, groups, monthGroups, undated } = g;
  let html = "";
  ordered.forEach(o => {
    const bucket = o.kind === "date" ? groups[o.key] : monthGroups[o.key];
    const label = o.kind === "date" ? dateGroupLabel(o.key) : monthGroupLabel(o.key);
    const id = `${idPrefix}-${o.key}`;
    html += sectionHeaderHtml(id, label, bucket.length, o.kind, o.key);
    html += sectionItemsHtml(id, bucket, itemHtmlFn, o.kind, o.key);
  });
  if(undated.length){
    const id = `${idPrefix}-undated`;
    html += sectionHeaderHtml(id, "日付未定", undated.length, "undated");
    html += sectionItemsHtml(id, undated, itemHtmlFn, "undated");
  }
  return html;
}
// 日付ジャンプ目次（折りたたみ式）。renderDateSectionsFromGroupsと同じidPrefix・
// 同じ集計結果(g)から作るため、目次の項目数・件数は本文の見出しと必ず一致する。
// グループが1件も無ければ目次自体を出さない（絞り込みで0件になった場合等）。
function renderJumpNavFromGroups(g, idPrefix){
  const { ordered, groups, monthGroups, undated } = g;
  const items = ordered.map(o => {
    const bucket = o.kind === "date" ? groups[o.key] : monthGroups[o.key];
    const label = o.kind === "date" ? dateGroupLabel(o.key) : monthGroupLabel(o.key);
    return { id: `${idPrefix}-${o.key}`, label: label, count: bucket.length };
  });
  if(undated.length) items.push({ id: `${idPrefix}-undated`, label: "日付未定", count: undated.length });
  if(!items.length) return "";
  return `<details class="datejump">
    <summary>日付ジャンプ<span class="num">（${items.length}）</span></summary>
    <div class="datejump-list">
      ${items.map(it => `<button type="button" class="datejump-btn" onclick="jumpToSection('${esc(it.id)}')">${esc(it.label)} <span class="num">${it.count}件</span></button>`).join("")}
    </div>
  </details>`;
}
function jumpToSection(id){
  // 折りたたみ中のグループへジャンプした場合は自動で展開してからスクロール
  // する（toggleSectionと同じDOM操作。既に開いている場合は何もしない）。
  const wrap = document.getElementById(id + "-items");
  if(wrap && wrap.classList.contains("collapsed")){
    wrap.classList.remove("collapsed");
    const btn = document.getElementById(id);
    if(btn) btn.setAttribute("aria-expanded", "true");
    sectionCollapse[id] = false;
    observeLazyImages();
  }
  const el = document.getElementById(id);
  if(el) el.scrollIntoView({ behavior: "smooth", block: "start" });
}

// カテゴリ面の各タブに属するかの判定。baseData()の各PAGE_MODE分岐と同じ
// グルーピング関数を再利用する（catFilterという単一のグローバル状態ではなく、
// 任意のtab値を引数に取れるようパラメータ化しただけで判定ロジック自体は
// 複製しない）。
function catTabPredicate(value){
  if(PAGE_MODE === "comic") return it => comicPublisherGroup(it.maker) === value;
  if(PAGE_MODE === "game") return it => gameHasPlatform(it, value);
  if(PAGE_MODE === "sports") return it => sportGroup(it.sport) === value;
  if(PAGE_MODE === "jump") return it => jumpGenreGroup(it) === value;
  if(PAGE_MODE === "news") return it => newsSourceGroup(it) === value;
  if(PAGE_MODE === "lottery") return it => it.game === value;
  if(PAGE_MODE === "stationery") return it => stationerySourceGroup(it) === value;
  if(PAGE_MODE === "rail") return it => railMakerGroup(it) === value;
  if(PAGE_MODE === "doll") return it => dollMakerGroup(it) === value;
  if(PAGE_MODE === "fishing") return it => fishingGearGroup(it) === value;
  if(value === "くじ") return isLotteryItem;
  return it => it.cat === value;
}
// カテゴリ面「◯◯面をすべて見る」の誘導リンク。既存のcattabsボタンを探して
// setCat()を呼ぶ（既存タブ絞り込みをそのまま起動）。1画面で結果を見せるため
// 案B（ストア、日付グループ表示）へ切り替える。
function goToCategoryTab(value){
  const btn = Array.from(document.querySelectorAll(".cattabs button")).find(b => b.getAttribute("data-cat") === value);
  if(btn) setCat(value, btn);
  show("B");
  window.scrollTo({top:0, left:0, behavior:"auto"});
}
// カテゴリ面本体。pool（本日のピックアップ商品を除いた「紙面一覧」相当の
// プール）を各タブでフィルタし、上位3件（computeFeatured基準）を「◯◯面」
// として表示する。該当0件のタブは出さない（空枠を出さない方針を統一適用）。
// タブが1つも無いページ（cattabsが実質存在しないケース。現状は全ページで
// 最低1つ以上あるが将来の保険）は何も出さない。
function categoryFacetsHtml(pool, excludeKeys){
  const tabs = catTabsList();
  if(!tabs.length) return "";
  let html = "";
  tabs.forEach(t => {
    const pred = catTabPredicate(t.value);
    const items = computeFeatured(pool.filter(i => pred(i) && !excludeKeys.has(i.key))).slice(0, 3);
    if(!items.length) return;
    html += `<div class="asakan-catface">
      <h3 class="asakan-catface-title">${esc(t.label)}面</h3>
      <ul class="asakan-catface-list">
        ${items.map(i => `<li><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a><span class="asakan-catface-meta num">${esc(fmtDate(i))}${fmtPrice(i) ? "｜" + fmtPrice(i) : ""}</span></li>`).join("")}
      </ul>
      <button type="button" class="asakan-more" onclick="goToCategoryTab('${esc(t.value)}')">${esc(t.label)}面をすべて見る &rarr;</button>
    </div>`;
  });
  return html ? `<div class="asakan-catfaces">${html}</div>` : "";
}
function renderC(){
  const el = document.getElementById("vC");
  const list = currentData();
  if(!list.length){ el.innerHTML = `<p style="color:var(--muted)">データがありません。</p>`; return; }

  // 本日のピックアップ商品（トップ1件＋準トップ4件）。選定自体はビルド時
  // （src/report.py _select_pickup）に完了済みで、it.picked==="top"/"sub"の
  // フラグから拾うだけ（JS側では選定ロジックを持たない）。絞り込みで
  // ピック対象がlistから外れている場合はトップ記事なしになる（仕様どおり
  // currentData()基準で表示する）。
  const pickedTop = list.find(i => i.picked === "top") || null;
  const pickedSubs = list.filter(i => i.picked === "sub").slice(0, 4);
  const pickedKeys = new Set();
  if(pickedTop) pickedKeys.add(pickedTop.key);
  pickedSubs.forEach(i => pickedKeys.add(i.key));

  // サマリー行: 「本日の新着」はこのページのDATA（currentData()適用後）、
  // 「締切 7日以内」「2週間以内」は共通データ（LOTTERY_COMMON.within7/
  // within14のtotal、表示上限5件ではなく実数）から機械集計する（捏造禁止。
  // 2026-08-10改修: 日数上限なしの単一件数から期限グループの件数へ変更）。
  const newCount = list.filter(i => i.first_seen === TODAY_ISO).length;
  const deadline7Count = LOTTERY_COMMON.within7.total;
  const deadline14Count = LOTTERY_COMMON.within14.total;

  const topHtml = pickedTop ? `
    <article class="asakan-top" data-key="${esc(pickedTop.key)}" onclick="handleCardClick(event)">
      ${isNewItem(pickedTop) ? `<span class="asakan-badge-new">NEW</span>` : ""}
      <a class="tlink" href="${esc(pickedTop.url)}" target="_blank" rel="noopener">${thumb(pickedTop, "asakan-top-img")}</a>
      <div class="asakan-top-body">
        <h2 class="asakan-top-title"><a href="${esc(pickedTop.url)}" target="_blank" rel="noopener">${esc(pickedTop.title)}</a></h2>
        <p class="asakan-lead">${esc(pickedTop.maker || "")}${pickedTop.maker ? "は" : ""}「${esc(pickedTop.title)}」を${esc(fmtDate(pickedTop))}に${pickupVerb(pickedTop)}。${fmtPrice(pickedTop) ? `価格は${fmtPrice(pickedTop)}。` : ""}</p>
        ${searchLinks(pickedTop)}
        ${lotteryLinksRow(pickedTop)}
        ${manualLinksRow(pickedTop)}
      </div>
    </article>` : "";
  const subHtml = pickedSubs.length ? `
    <div class="asakan-substories">
      ${pickedSubs.map(i => `
        <article class="asakan-sub" data-key="${esc(i.key)}" onclick="handleCardClick(event)">
          ${isNewItem(i) ? `<span class="asakan-badge-new small">NEW</span>` : ""}
          <a class="tlink" href="${esc(i.url)}" target="_blank" rel="noopener">${thumb(i, "asakan-sub-img")}</a>
          <h3 class="asakan-sub-title"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a></h3>
          <p class="asakan-sub-meta num">${esc(i.maker || "")}${i.maker ? "｜" : ""}${esc(fmtDate(i))}${fmtPrice(i) ? "｜" + fmtPrice(i) : ""}</p>
        </article>`).join("")}
    </div>` : "";

  const newsHtml = NEWS_COMMON.length ? `
    <section class="asakan-news">
      <h2 class="asakan-section-title">本日のピックアップニュース</h2>
      <ul class="asakan-news-list">
        ${NEWS_COMMON.map(n => `
          <li class="asakan-news-item">
            <span class="asakan-news-tag">${esc(newsCommonTag(n.key))}</span>
            <a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>
            ${n.maker ? `<span class="asakan-news-maker">${esc(n.maker)}</span>` : ""}
          </li>`).join("")}
      </ul>
    </section>` : "";

  // 締切間近を期限グループ（7日以内/2週間以内(8〜14日)/15日以降）で表示する
  // （2026-08-10改修、ユーザー原文「期限ごとに表示したら？例えば7日以内、
  // ２週間以内とかっていう感じ」）。各グループ0件はそのグループごと非表示、
  // 全グループ0件（lotteryTotal===0）ならボックス自体を非表示にする
  // （従来仕様を踏襲）。
  const lotteryTotal = LOTTERY_COMMON.within7.total + LOTTERY_COMMON.within14.total + LOTTERY_COMMON.beyond15.total;
  const lotteryHtml = lotteryTotal ? `
    <section class="asakan-lottery">
      <h2 class="asakan-section-title asakan-lottery-title">締切間近</h2>
      ${lotteryDeadlineGroupHtml("7日以内", LOTTERY_COMMON.within7)}
      ${lotteryDeadlineGroupHtml("2週間以内（8〜14日）", LOTTERY_COMMON.within14)}
      ${LOTTERY_COMMON.beyond15.total ? `<p class="asakan-lottery-more"><a href="lottery.html">ほか 15日以降の締切 ${LOTTERY_COMMON.beyond15.total}件 &rarr; 予約・抽選ページへ</a></p>` : ""}
    </section>` : "";

  const facetsHtml = categoryFacetsHtml(list, pickedKeys);

  // 紙面一覧: 従来の朝刊の日付グループ一覧（既存の折りたたみ・日付ジャンプ
  // 機能をそのまま流用）。本日のピックアップ商品として既に出た分は除外する。
  const restList = list.filter(i => !pickedKeys.has(i.key));
  const g = groupItemsByDate(restList);
  const shimenHtml = restList.length ? `
    <div class="asakan-section-title asakan-shimen-title">紙面一覧<span class="asakan-shimen-cnt num">${restList.length}件</span></div>
    <div id="jumpNavC">${renderJumpNavFromGroups(g, "secC")}</div>
    <div class="flist">${renderDateSectionsFromGroups(g, flistItemHtml, "secC")}</div>` : "";

  el.innerHTML = `
    <header class="asakan-masthead">
      <div class="asakan-masthead-row">
        <div class="asakan-title-block">
          <div class="asakan-vtitle">新商品ウォッチ</div>
          <div class="asakan-hanko">朝刊</div>
        </div>
        <div class="asakan-issue-info">
          <p class="asakan-issue-date num">2026年9月2日（水）</p>
          <p class="asakan-issue-note">毎朝7時更新</p>
        </div>
      </div>
      <div class="asakan-rule-double"></div>
    </header>
    <div class="asakan-summary num">本日の新着 <strong>${newCount}</strong>件｜締切 7日以内 <strong>${deadline7Count}</strong>件｜2週間以内 <strong>${deadline14Count}</strong>件</div>
    ${(topHtml || subHtml) ? `<div class="asakan-topblock">${topHtml}${subHtml}</div>` : ""}
    ${newsHtml}
    ${lotteryHtml}
    ${facetsHtml}
    ${shimenHtml}
    ${lotteryCompactHtml()}`;
  observeLazyImages();
}

/* ── 商品詳細モーダル ── */
function modalDetailRow(label, value){
  if(!value) return ""; // 値が無い項目は行自体を出さない（予約開始/抽選締切など）
  return `<div class="modal-row"><span class="modal-label">${esc(label)}</span><span class="modal-value">${esc(value)}</span></div>`;
}
function modalLinksHtml(item){
  // リンク集: 商品ページを開く／メルカリ／Amazon／楽天／eBay／eBayリサーチ／
  // （トレカ/抽選のみ）相場グラフサイト／
  // 🔖手動登録の予約リンク（config/manual_links.json。あれば。noteがあれば
  // リンク横に小さく表示）／🎯verified抽選予約リンク（あれば）／
  // 🔍 Googleで探す
  const title = item.title;
  const q = encodeURIComponent((title || "").slice(0, 40));
  const eq = encodeURIComponent(item.en_q ? item.en_q : extractEbayQuery(title));
  const verifiedLottery = (item.lottery || []).filter(l => l.verified);
  let html = `<div class="modal-links">`;
  html += `<a class="modal-link primary" href="${esc(item.url)}" target="_blank" rel="noopener">商品ページを開く</a>`;
  html += `<a class="modal-link" href="https://jp.mercari.com/search?keyword=${q}" target="_blank" rel="noopener">メルカリ</a>`;
  html += `<a class="modal-link" href="https://www.amazon.co.jp/s?k=${q}" target="_blank" rel="noopener">Amazon</a>`;
  html += `<a class="modal-link" href="https://search.rakuten.co.jp/search/mall/${q}/" target="_blank" rel="noopener">楽天</a>`;
  html += `<a class="modal-link" href="https://www.ebay.com/sch/i.html?_nkw=${eq}" target="_blank" rel="noopener">eBay</a>`;
  html += `<a class="modal-link" href="${ebayResearchUrl(eq)}" target="_blank" rel="noopener">eBayリサーチ</a>`;
  const soba = sobaLinkInfo(item);
  if(soba) html += `<a class="modal-link" href="${soba[1]}" target="_blank" rel="noopener">${soba[0]}</a>`;
  (item.manual_links || []).forEach(l => {
    const note = l.note ? `<span class="modal-link-note">${esc(l.note)}</span>` : "";
    html += `<span class="modal-link-wrap"><a class="modal-link manual" href="${esc(l.url)}" target="_blank" rel="noopener">🔖 ${esc(l.label)}</a>${note}</span>`;
  });
  verifiedLottery.forEach(l => {
    html += `<a class="modal-link accent" href="${esc(l.url)}" target="_blank" rel="noopener">🎯 ${esc(l.site)}</a>`;
  });
  html += `<a class="modal-link muted" href="${googleLotterySearchUrl(item)}" target="_blank" rel="noopener">🔍 抽選・予約をGoogleで探す</a>`;
  html += `</div>`;
  return html;
}
function modalContentHtml(item){
  return `
    <div class="modal-thumb">${thumb(item)}</div>
    <h2 id="modalTitle" class="modal-title">${esc(item.title)}</h2>
    <div class="modal-chips">${chips(item, true)}</div>
    <div class="modal-details">
      ${modalDetailRow("カテゴリ", item.cat)}
      ${modalDetailRow("種別", item.kind)}
      ${modalDetailRow("メーカー", item.maker)}
      ${modalDetailRow("発売日", item.date ? fmtDate(item) : "")}
      ${modalDetailRow("予約開始", item.preorder_start)}
      ${modalDetailRow("抽選締切", item.lottery_deadline)}
      ${modalDetailRow("価格", fmtPrice(item))}
    </div>
    ${modalLinksHtml(item)}`;
}
function openModal(item){
  const overlay = document.getElementById("modalOverlay");
  const body = document.getElementById("modalBody");
  if(!overlay || !body) return;
  body.innerHTML = modalContentHtml(item);
  observeLazyImages();
  overlay.hidden = false;
  document.body.style.overflow = "hidden"; // 開いている間は背景をスクロールさせない
  const closeBtn = document.getElementById("modalClose");
  if(closeBtn) closeBtn.focus(); // フォーカス管理は簡易に：閉じるボタンへ
}
function closeModal(){
  const overlay = document.getElementById("modalOverlay");
  if(!overlay || overlay.hidden) return;
  overlay.hidden = true;
  document.body.style.overflow = "";
}
function openModalByKey(key){
  const item = KEY_TO_ITEM[key];
  if(item) openModal(item);
}
function handleCardClick(e){
  // カード/行の内部リンク（画像・タイトル・検索リンク等）のクリックでは
  // モーダルを開かない（リンク自身の遷移を優先する）
  if(e.target.closest("a")) return;
  const key = e.currentTarget.getAttribute("data-key");
  if(key) openModalByKey(key);
}
function handleOverlayClick(e){
  // オーバーレイの背景部分（シート自体ではない）をクリックしたときだけ閉じる
  if(e.target.id === "modalOverlay") closeModal();
}
document.addEventListener("keydown", function(e){
  if(e.key === "Escape") closeModal();
});

function show(v){
  for(const k of ["A","B","C"]){
    document.getElementById("v"+k).hidden = (k !== v);
    document.getElementById("b"+k).classList.toggle("on", k === v);
  }
  try{ localStorage.setItem("rw_view", v); }catch(e){}
}

function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  try{ localStorage.setItem("rw_theme", t); }catch(e){}
  const btn = document.getElementById("themeToggle");
  if(btn) btn.textContent = t === "dark" ? "☀ ライト" : "🌙 ダーク";
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  applyTheme(cur === "dark" ? "light" : "dark");
}
(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem("rw_theme"); }catch(e){}
  if(saved === "light" || saved === "dark"){
    applyTheme(saved);
  } else {
    const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    const btn = document.getElementById("themeToggle");
    if(btn) btn.textContent = prefersDark ? "☀ ライト" : "🌙 ダーク";
  }
})();

// ── トップへ戻るボタン ──
// 1画面分（window.innerHeight、下限400px）を超えて下スクロールしたら表示する。
// スムーズスクロールはprefers-reduced-motionを尊重してauto/smoothを切り替える。
function scrollToTop(){
  const reduceMotion = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.scrollTo({top:0, left:0, behavior: reduceMotion ? "auto" : "smooth"});
}
(function initBackToTop(){
  const btn = document.getElementById("backToTop");
  if(!btn) return;
  function threshold(){ return Math.max(window.innerHeight || 0, 400); }
  function onScroll(){
    btn.classList.toggle("show", (window.scrollY || window.pageYOffset || 0) > threshold());
  }
  window.addEventListener("scroll", onScroll, {passive:true});
  window.addEventListener("resize", onScroll, {passive:true});
  onScroll();
})();

try{
  // 有効な絞り込み値は「このページに実在するcattabsボタンのdata-cat」から
  // 動的に判定する（ページ種別ごとに語彙が違うため、固定リストで決め打ちしない）。
  const validCats = Array.from(document.querySelectorAll(".cattabs button")).map(b => b.getAttribute("data-cat"));
  const savedCat = localStorage.getItem(catStorageKey());
  if(savedCat !== null && validCats.indexOf(savedCat) !== -1) catFilter = savedCat;
}catch(e){}
document.querySelectorAll(".cattabs button").forEach(b => {
  b.classList.toggle("on", b.getAttribute("data-cat") === catFilter);
});

try{
  const savedGroup = localStorage.getItem("rw_group");
  if(savedGroup === "date" || savedGroup === "flat") groupB = savedGroup;
}catch(e){}

loadExtraFilters();
renderFilterBar();
renderAll();
// lottery.html は「締切昇順で一覧表示」が主目的のため、初回表示（未保存時）は
// 日付グループ表示が既定の案B（ストア）を初期ビューにする。他ページは従来通り
// 案A（ポータル）。ユーザーが一度でも表示を切り替えれば以後はlocalStorage(rw_view)
// が優先される（下のtryブロックで上書きされる）。
let initialView = PAGE_MODE === "lottery" ? "B" : "A";
try{
  const savedView = localStorage.getItem("rw_view");
  if(savedView === "A" || savedView === "B" || savedView === "C") initialView = savedView;
}catch(e){}
show(initialView);
</script>
